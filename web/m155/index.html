<style>.source-wrap {
  --source-ink: #35443a;
  --source-gutter: 3.5rem;
  --source-right: 1.35rem;
  --source-top: 1.35rem;
  --source-bottom: 2.1rem;
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  isolation: isolate;
  background: #fafaf6;
}
.source-wrap #source,
.source-wrap #sourcePaint {
  box-sizing: border-box;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: var(--source-top) var(--source-right) var(--source-bottom) var(--source-gutter);
  border: 0;
  border-radius: 0;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
  font-size: .9375rem;
  font-weight: 400;
  font-style: normal;
  font-variant-ligatures: none;
  line-height: 1.82;
  letter-spacing: 0;
  word-spacing: normal;
  text-align: left;
  text-indent: 0;
  text-transform: none;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
  line-break: auto;
}
.source-wrap #source {
  z-index: 1;
  display: block;
  appearance: none;
  resize: none;
  overflow: auto;
  outline: none;
  background: transparent;
  color: var(--source-ink);
  caret-color: #1d4832;
}
.source-wrap #source::placeholder { color: #85897d; opacity: 1; }
.source-wrap #sourcePaint {
  z-index: 0;
  inset-inline-end: auto;
  overflow: hidden;
  visibility: hidden;
  pointer-events: none;
  user-select: none;
  color: var(--source-ink);
}
.source-wrap.has-source-paint #sourcePaint { visibility: visible; }
.source-wrap.has-source-paint #source { color: transparent; -webkit-text-fill-color: transparent; }
.source-wrap.has-source-paint #source::selection {
  color: transparent;
  background: rgba(115, 159, 111, .32);
}
.source-wrap.has-source-paint #source::placeholder { -webkit-text-fill-color: #85897d; }
.source-wrap #sourcePaint .source-line {
  position: relative;
  margin: 0;
  padding: 0;
  border: 0;
  min-height: 1lh;
}
.source-wrap #sourcePaint .source-line::before {
  position: absolute;
  top: 0;
  left: calc(-1 * var(--source-gutter));
  width: calc(var(--source-gutter) - 1rem);
  content: attr(data-line);
  color: #969b90;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: .75rem;
  line-height: 1.70625rem;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
#sourcePaint .src-heading { color: #255437; }
#sourcePaint .src-marker { color: #a2583f; }
#sourcePaint .src-code { color: #8a5b36; }
#sourcePaint .src-em { color: #5d6640; }
#sourcePaint .src-link { color: #416d64; }
#sourcePaint .src-quote { color: #65745b; }
@media (max-width: 720px) {
  .source-wrap { --source-gutter: 3rem; --source-right: 1rem; --source-top: 1rem; }
  .source-wrap #source, .source-wrap #sourcePaint { font-size: 1rem; line-height: 1.8; }
  .source-wrap #sourcePaint .source-line::before { line-height: 1.8rem; }
}
@media (forced-colors: active) {
  .source-wrap.has-source-paint #sourcePaint { visibility: hidden; }
  .source-wrap.has-source-paint #source { color: CanvasText; -webkit-text-fill-color: CanvasText; }
  .source-wrap.has-source-paint #source::selection { color: HighlightText; background: Highlight; }
}
</style>

      else {const fresh=makeDoc('未命名文稿','');records.set(fresh.id,fresh);select(fresh,true);}
    } else drawList();
    notify('文稿已删除');
  };
  $('newBtn').onclick=()=>newDocument(nextName(),'');
  $('openBtn').onclick=()=>$('fileInput').click();
  $('fileInput').onchange=async e=>{
    const file=e.target.files[0]; e.target.value='';if(!file)return;
    try {
      const content=(await file.text()).replace(/^\uFEFF/,'');
      const name=file.name.replace(/\.(md|markdown|mdown|txt)$/i,'').trim()||'导入文稿';
      newDocument(name,content.replace(/\r\n?/g,'\n')); notify('已打开 '+file.name);
    } catch{notify('读取文件失败，请重新打开');}
  };
  function exportDoc() {
    save();
    const name=(active.name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').replace(/[. ]+$/,'').slice(0,150)||'文稿')+'.md';
    const url=URL.createObjectURL(new Blob([source.value],{type:'text/markdown;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000); notify('已发起下载');
  }
  $('exportBtn').onclick=exportDoc;
  const help=[['标题','# 一级标题\n## 二级标题'],['加粗 / 斜体','**加粗文字**　*斜体文字*'],['引用','> 需要引用的内容'],['列表','- 无序项目\n1. 有序项目'],['任务','- [ ] 待办事项\n- [x] 已完成'],['链接','[链接文字](https://example.com)'],['代码','`行内代码`\n```js\nconst x = 1;\n```'],['表格','| 项目 | 说明 |\n| --- | --- |\n| 示例 | 内容 |']];
  for(const [label,syntax] of help) {
    const row=element('div',undefined,'help-row');row.append(element('span',label),element('code',syntax));$('helpRows').append(row);
  }
  const mod=/Mac|iPhone|iPad/.test(navigator.platform)?'⌘':'Ctrl';
  $('shortcutNote').textContent=mod+'+B 加粗　'+mod+'+K 链接　'+mod+'+S 下载';
  $('helpBtn').onclick=()=>{closeSide();$('helpDialog').showModal();};
  document.addEventListener('keydown',e=>{
    if(e.isComposing || document.querySelector('dialog[open]')) return;
    if(e.key==='Escape'){if(openPopup){closePopup(true);}else{closeSide(true);}return;}
    if(openPopup && ['ArrowDown','ArrowUp'].includes(e.key)){
      e.preventDefault();const buttons=Array.from(openPopup.querySelectorAll('button'));const i=buttons.indexOf(document.activeElement);
      buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s') { e.preventDefault();exportDoc(); }
    if(e.key==='?'&&!e.ctrlKey&&!e.metaKey&&!e.target.closest('input,textarea,[contenteditable]')) {
      e.preventDefault();$('helpBtn').click();
    }
    if(e.key==='Tab' && small.matches && $('sidebar').classList.contains('open')) {
      const controls=Array.from($('sidebar').querySelectorAll('button')).filter(b=>b.offsetParent!==null);
      const last=controls.at(-1); if(e.shiftKey && document.activeElement===controls[0]){e.preventDefault();last.focus();}
      else if(!e.shiftKey && document.activeElement===last){e.preventDefault();controls[0].focus();}
    }
  });
  load();displayMode();
})();
</script>
</body></html>

function render(){const focus=rememberFocus(),s=store.getState();$('.main-nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').textContent=page==='works'?'把喜欢的自己，留在这里。':page==='stage'?'给这套造型，一个故事。':'今天，想成为怎样的自己？';$('#worksCount').textContent=store.listWorks().length;$('#workbench').hidden=page==='works';$('#worksView').hidden=page!=='works';$('#workbench').classList.toggle('stage-mode',page==='stage');$('#undo').innerHTML=icon('undo');$('#redo').innerHTML=icon('redo');$('#undo').disabled=!store.canUndo();$('#redo').disabled=!store.canRedo();const status=store.storageStatus();$('#saveStatus').textContent=!status.available?'本次未保存 · 可继续拍照':status.draftSaved?'草稿已留在本机':'灵感随时开始';$('#saveStatus').style.color=status.available?'':'#a96d51';$('#saveStatus').classList.toggle('save-error',!status.available);renderTheme(s);
 if(page==='works')renderWorks();else{renderNav();renderPreview(s);renderPanel(s);}if(focus){const el=$(focus);if(el&&el!==document.activeElement)el.focus({preventScroll:true});}}
function renderNav(){let html='';E.categories.forEach((c,i)=>{if(i===0||i===5||i===8)html+=`<div class="cat-group">${i===0?'面容与发型':i===5?'细节与点缀':'衣着与步履'}</div>`;html+=`<button class="cat-button ${c.id===category?'active':''}" data-cat="${c.id}" aria-pressed="${c.id===category}">${icon(c.id)}<span>${c.label}</span><span class="cat-count">${c.items.length.toString().padStart(2,'0')}</span></button>`;});$('#categoryNav').innerHTML=html;}
function renderPreview(s){const p={...s,scene:page==='wardrobe'?'studio':s.scene};const landscape=page==='stage'&&s.format==='landscape';$('#portrait').innerHTML=A.frame(p,{width:landscape?1600:800,height:landscape?900:1000});$('#portrait').classList.toggle('landscape',landscape);$('#sceneName').textContent=sceneName(p.scene);$('#viewLabel').textContent=`${{full:'全身',half:'半身',face:'面部特写'}[s.framing]} · ${s.pose==='turn'?'轻侧身':'正面'}`;$('#bodyControls').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.body===s.body);b.setAttribute('aria-pressed',b.dataset.body===s.body);});$('#framingButtons').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.frame===s.framing);b.setAttribute('aria-pressed',b.dataset.frame===s.framing);});$('#focusLock').innerHTML=icon(focusLocked?'lock':'unlock');$('#focusLock').title=focusLocked?'已锁定取景，点击解锁':'锁定取景，切换分类时保持画面';$('#focusLock').setAttribute('aria-pressed',focusLocked);$('[data-action="resetview"]').innerHTML=icon('reset');const notice=E.compatibility(s);$('#compatNotice').innerHTML=notice.length?`<span>${esc(notice[0])}</span>`:'';$('#stageCta').dataset.page=page==='stage'?'wardrobe':'stage';$('#stageCta').innerHTML=page==='stage'?'返回衣橱继续搭配 <span>←</span>':'去舞台拍张照 <span>→</span>';}
const palettes={hair:['#382b2b','#765144','#a16b49','#c9b590','#222a32','#b38b87'],brow:['#382b2b','#765144','#a16b49','#c9b590','#4c4a40','#835b57'],eyes:['#5d6254','#77553c','#5e8792','#a28b60','#817798','#313b48'],mouth:['#b76868','#bf8170','#994b50','#cd9294','#a27875','#87494a'],top:['#d8cfc0','#f1eadb','#6a7e68','#b87861','#485b68','#292e32'],bottom:['#3d4c43','#687c8b','#c1b098','#8a786f','#51484d','#b9b6a5'],shoes:['#453e38','#eee5d1','#7e8b70','#a67c64','#494f58','#8d5750'],metal:['#b89a62','#b7beb9','#bd8d79','#d1bd8d','#858a80','#d4ccbd'],skin:['#f3d5bc','#edbea5','#d8a085','#b78164','#95654c','#694a39']};
const colorNames={hair:'发色',brow:'眉色',eyes:'虹膜颜色',mouth:'唇色',top:'上衣配色',bottom:'下衣配色',shoes:'鞋履配色',metal:'饰物金属色',skin:'肤色'};
function colorSection(key,s){return `<div class="color-section"><div class="section-label">${colorNames[key]}<span>点击即刻呈现</span></div><div class="swatches">${palettes[key].map((color,i)=>`<button class="swatch ${s.colors[key]===color?'active':''}" style="background:${color}" data-color-key="${key}" data-color="${color}" aria-label="${colorNames[key]} ${i+1}" aria-pressed="${s.colors[key]===color}" title="${colorNames[key]} ${i+1}"></button>`).join('')}</div></div>`;}
function itemsMarkup(s){const c=E.categories.find(x=>x.id===category),items=c.items.filter(i=>!query||i.name.includes(query)||i.tag.includes(query)||i.code.includes(query));return items.length?items.map(i=>`<button class="item-card ${s.slots[i.slot]===i.id?'selected':''}" data-item="${i.id}" aria-label="试穿${esc(i.name)}${s.slots[i.slot]===i.id?'，已穿戴':''}" aria-pressed="${s.slots[i.slot]===i.id}"><div class="item-picture">${A.thumbnail(s,category,i)}${s.slots[i.slot]===i.id?'<span class="selected-check">✓ 已穿</span>':''}</div><span class="item-name">${esc(i.name)}</span><span class="item-no">${category.toUpperCase()} / ${i.code}</span></button>`).join(''):`<div class="no-results">没有找到“${esc(query)}”<br><button class="text-btn" data-action="clearsearch">清空搜索，看看所有款式</button></div>`;}
function renderPanel(s){if(page==='stage'){renderStagePanel(s);return;}const c=E.categories.find(x=>x.id===category),label={hair:'从轮廓开始，为今天找一点灵感。',brow:'让眉峰与眉尾，说出不同的情绪。',eyes:'眼型改变轮廓，瞳色单独选择。',ears:'圆润或尖长，细节也可以有想象力。',mouth:'一点唇形变化，也是一种表达。',jewelry:'耳、腕、指各占一栏，可以同时佩戴。',necklace:'靠近领口的光，轻轻点亮整套造型。',accessory:'头戴、眼镜、包与手持物，各自独立。',top:'看版型，也看一件衣服的性格。',bottom:'裤装与裙装，都可以自由搭配。',shoes:'让每一步，都延续今天的风格。'}[category];let color=['hair','brow','eyes','mouth','top','bottom','shoes'].includes(category)?category:['jewelry','necklace','accessory'].includes(category)?'metal':'skin';$('#editor').innerHTML=`<div class="panel-kicker">THE WARDROBE / ${String(E.categories.indexOf(c)+1).padStart(2,'0')}</div><div class="panel-heading"><h2>${c.label}</h2><button class="text-btn" data-action="worn">${icon('lock')} 已穿与锁定</button></div><p class="panel-description">${label}</p><input class="search" id="itemSearch" type="search" value="${esc(query)}" placeholder="搜索名称、风格或款号" aria-label="搜索当前分类款式"><div class="item-grid" id="itemGrid">${itemsMarkup(s)}</div><div class="divider"></div>${colorSection(color,s)}${color!=='skin'?colorSection('skin',s):''}<button class="random-button" data-action="randomgroup">${icon('shuffle')} 换一组${c.label}灵感</button><div class="panel-footnote">${c.items.length} 款可试穿 · 所有款式，两位角色共用<br>锁定喜欢的部件，随机时会为你保留。</div><div class="mobile-only"><button class="text-btn" data-action="themes">主题邀约 ↗</button><button class="text-btn" data-action="randomall">随机一整套 ↻</button><button class="text-btn mobile-save" data-action="save">保存这套造型 ↗</button></div>`;}
function renderStagePanel(s){$('#editor').innerHTML=`<div class="panel-kicker">SET THE SCENE</div><div class="panel-heading"><h2>故事发生在哪里</h2><button class="text-btn" data-action="themes">主题邀约 ↗</button></div><p class="panel-description">选择场景、姿势和画幅。左侧就是最终取景。</p><div class="scene-grid">${S.scenes.map(x=>`<button class="scene-card ${s.scene===x.id?'active':''}" data-scene="${x.id}" aria-pressed="${s.scene===x.id}"><div class="scene-picture"><svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${S.render(x.id)}</svg></div><strong>${s.scene===x.id?'✓ ':''}${x.name}</strong><small>${esc(x.tag||'独立场景')}</small></button>`).join('')}</div><div class="divider"></div><div class="section-label">站姿<span>二维插画姿态</span></div><div class="pose-list">${[['relaxed','自然站立'],['lean','重心侧移'],['turn','轻侧身'],['wave','抬手示意']].map(([id,label])=>`<button data-pose="${id}" class="${s.pose===id?'active':''}" aria-pressed="${s.pose===id}" ${id==='wave'&&s.slots.held?'disabled title="手持物与抬手姿势不兼容"':''}>${label}${id==='wave'&&s.slots.held?'<span>取下手持物后可用</span>':''}</button>`).join('')}</div><div class="divider"></div><div class="section-label">照片画幅<span>不包含操作界面</span></div><div class="segmented format-control"><button data-format="portrait" class="${s.format==='portrait'?'active':''}">竖幅 4:5</button><button data-format="landscape" class="${s.format==='landscape'?'active':''}">横幅 16:9</button></div><div class="check-row"><span>柔光补亮环境</span><button class="switch ${s.fill?'':'off'}" role="switch" aria-checked="${s.fill}" aria-label="柔光补亮环境" data-action="fill"></button></div><button class="btn dark block capture" data-action="capture">${icon('camera')} 拍下这一刻 <span>↗</span></button><p class="panel-footnote">拍照保存 PNG；“保存造型”保留可编辑作品。<br>返回衣橱时，穿搭和舞台都会保留。</p>`;}
function themeChecks(s,t){return [Object.values(s.slots).some(id=>id&&E.CATALOG[id]&&['top','bottom','shoes'].includes(E.CATALOG[id].slot)&&E.CATALOG[id].tag===t.tag),s.scene===t.scene,s.framing===t.frame];}
function renderTheme(s){const bar=$('#themeBar');bar.hidden=!theme;if(!theme)return;const t=themes.find(t=>t.id===theme),checks=themeChecks(s,t),labels=[`${t.tag}标签衣物`,sceneName(t.scene),t.frame==='full'?'全身构图':'半身构图'];bar.innerHTML=`<div class="theme-progress"><strong>${t.name}</strong>${checks.map((yes,i)=>`<span class="stamp ${yes?'complete':''}">${yes?'✓':'○'} ${labels[i]}</span>`).join('')}<button class="text-btn" data-action="themeoff">回到自由搭配 ×</button></div>`;}
function renderWorks(){const works=store.listWorks();$('#worksView').innerHTML=works.length?`<p class="panel-description">${works.length} 套造型留在本机 · 点“继续编辑”即可还原角色、穿搭、颜色和舞台。</p><div class="works-grid">${works.map(w=>`<article class="work-card"><div class="work-cover">${A.frame(w.snapshot,{width:w.snapshot.format==='landscape'?1600:800,height:w.snapshot.format==='landscape'?900:1000})}</div><div class="work-meta"><h3>${esc(w.name)}</h3><time>${new Date(w.updatedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${sceneName(w.snapshot.scene)}</time><div class="work-actions"><button class="btn light" data-open-work="${w.id}">继续编辑 ↗</button><button class="icon-btn" data-rename-work="${w.id}" title="重命名" aria-label="重命名${esc(w.name)}">✎</button><button class="icon-btn" data-delete-work="${w.id}" title="删除" aria-label="删除${esc(w.name)}">×</button></div></div></article>`).join('')}</div>`:`<div class="empty-state"><div class="empty-symbol">m.</div><h2>第一套作品，等你来命名。</h2><p>在衣橱里搭一套喜欢的造型，再点击“保存造型”。<br>每一次打开，都能接着上一次的灵感。</p><button class="btn dark" data-page="wardrobe">开始自由搭配 →</button></div>`;}
function modal(title,body,kicker='MIRROR ATELIER'){const d=$('#dialog'),wasOpen=d.open;if(!wasOpen)dialogOpener=rememberFocus();$('#dialogTitle').innerHTML=`<small>${kicker}</small><h2 id="dialogHeading">${title}</h2>`;d.setAttribute('aria-labelledby','dialogHeading');$('#dialogBody').innerHTML=body;d.querySelector('.dialog-head [data-action="close"]').hidden=draftDecisionPending;if(!wasOpen)d.showModal();}
function close(){if(draftDecisionPending)return;const d=$('#dialog');d.close();if(photoURL){if(photoURL.startsWith('blob:'))URL.revokeObjectURL(photoURL);photoURL=null;}restoreDialogFocus();}
function showDraftChoice(){modal('继续上一次的造型吗？',`<p class="dialog-copy">发现一份留在本机的草稿。继续后可以接着搭配；开始新造型会替换这份草稿，已命名作品仍然保留。</p><div class="dialog-buttons"><button class="btn light" data-action="fresh">开始新造型</button><button class="btn dark" data-action="restore" autofocus>继续上次的造型</button></div>`,'WELCOME BACK');focusVisible('[data-action="restore"]',$('#dialog'));}
function redrawWorn(preferred){openWorn();if(!focusVisible(preferred,$('#dialog')))focusVisible('[data-action="randomall"]',$('#dialog'));}
function openThemes(){modal('从一封邀约开始',`<p class="dialog-copy">每张邀约有三个公开条件，没有审美评分。完成任意数量，都可以拍照留念。</p>${themes.map(t=>`<article class="theme-card"><span class="tiny">${t.en}</span><h3>${t.name}</h3><p>${t.text}</p><div class="requirements">${t.tag}衣物 · ${sceneName(t.scene)} · ${t.frame==='full'?'全身':'半身'}照</div><button class="btn light" data-theme="${t.id}">接受邀约，自己搭配 →</button><button class="text-btn" data-starter="${t.id}">试穿参考搭配 ↗</button></article>`).join('')}`,'LET A STORY BEGIN');}
function openWorn(){const s=store.getState();modal('这一刻，穿在身上的',`<p class="dialog-copy">锁定只作用于随机搭配。手动选款仍可替换；耳饰、腕饰、戒指和配饰互不占位。</p>${E.compatibility(s).map(n=>`<p class="dialog-copy">${esc(n)}</p>`).join('')}${Object.keys(slotNames).map(slot=>{const item=E.CATALOG[s.slots[slot]];return `<div class="worn-row"><div>${item?esc(item.name):'未佩戴'}<small>${slotNames[slot]}${item?' · '+item.code:''}</small></div><div class="worn-actions"><button data-lock-slot="${slot}" class="${s.locks.includes(slot)?'locked':''}">${s.locks.includes(slot)?'已锁定 ✓':'锁定'}</button>${item&&optional.includes(slot)?`<button data-remove-slot="${slot}">取下</button>`:''}</div></div>`;}).join('')}<button class="btn dark block" style="margin-top:20px" data-action="randomall">随机未锁定部件 ↻</button>`);}
function openSave(){const w=currentWork&&store.listWorks().find(w=>w.id===currentWork);pendingNameAction={kind:'save',id:w?.id};modal(w?'留住这次修改':'给这套造型起个名字',`<p class="dialog-copy">保存角色、款号、颜色、舞台和构图，下次可以继续编辑。作品仅保存在当前浏览器。</p><form id="nameForm"><label class="form-label" for="workName">作品名称</label><input class="name-input" id="workName" maxlength="60" value="${esc(w?.name||'')}" placeholder="例如：候车的人" required autocomplete="off"><div class="form-error" id="nameError" role="alert"></div><div class="dialog-buttons"><button type="button" class="btn light" data-action="close">取消</button>${w?'<button type="button" class="btn light" data-action="savecopy">另存新作品</button>':''}<button class="btn dark" type="submit">${w?'更新这套作品':'保存作品'}</button></div></form>`,'SAVE YOUR LOOK');$('#workName').focus();$('#workName').select();}
function nameSubmit(asCopy=false){let name=$('#workName').value.trim();let r;if(pendingNameAction.kind==='rename')r=store.renameWork(pendingNameAction.id,name);else r=store.saveWork(name,asCopy?undefined:pendingNameAction.id);if(!r.ok){$('#nameError').textContent=r.reason==='duplicate'?'这个名字已经用过了，请换一个名字，原作品会保留。':r.reason==='empty-name'?'请先为作品写一个名字。':'当前浏览器未能保存。原作品未改动，你仍可导出照片。';return;}if(r.work)currentWork=r.work.id;close();render();toast(pendingNameAction.kind==='rename'?'作品已重命名。':'造型已保存，可以在作品册继续编辑。');}
async function capture(){
 if(captureBusy)return;captureBusy=true;const captureButton=$('[data-action="capture"]');if(captureButton){captureButton.disabled=true;captureButton.textContent='正在冲印…';}
 const s=store.getState(),width=s.format==='landscape'?1920:1080,height=s.format==='landscape'?1080:1350;
 try{const svg=A.frame(s,{width,height}),img=new Image();await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{img.onload=null;img.onerror=null;reject(new Error('image-timeout'));},6000);img.onload=()=>{clearTimeout(timeout);resolve();};img.onerror=()=>{clearTimeout(timeout);reject(new Error('image-load-failed'));};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('canvas-unavailable');ctx.drawImage(img,0,0,width,height);
 if(captureButton)captureButton.textContent='正在生成照片…';if(photoURL&&photoURL.startsWith('blob:'))URL.revokeObjectURL(photoURL);photoURL=canvas.toDataURL('image/png');const t=theme&&themes.find(t=>t.id===theme),stamps=t?themeChecks(s,t).filter(Boolean).length:null;
 modal('这一刻，值得留下',`<div class="photo-preview"><img src="${photoURL}" alt="当前造型导出的无界面照片"></div><p class="photo-caption">${width} × ${height} PNG · ${sceneName(s.scene)}${t?`<br>「${t.name}」收片完成 · 点亮 ${stamps}/3 枚印章。每一种表达都值得保存。`:''}<br>照片不可继续换装。需要保留穿搭，请同时保存造型。</p><div class="dialog-buttons"><button class="btn light" data-action="save">保存造型</button><a class="btn dark" href="${photoURL}" download="镜间造型室-${Date.now()}.png">下载照片 ↓</a></div><p class="photo-caption">如果下载未开始，可长按或右键上方照片保存。</p>`,'YOUR MOMENT, CAPTURED');
 }catch(e){console.error('Mirror photo export:',e.message);toast(e.message.includes('timeout')?'照片生成超时，造型仍保留。请重新拍照。':'照片未能生成，造型仍保留。请重试拍照。');}
 finally{captureBusy=false;if(page==='stage')renderPanel(store.getState());}
}
document.addEventListener('input',e=>{if(e.target.id==='itemSearch'){query=e.target.value;$('#itemGrid').innerHTML=itemsMarkup(store.getState());}});

 if(d.starter){const t=themes.find(t=>t.id===d.starter);theme=t.id;store.apply({slots:t.look,scene:t.scene,framing:t.frame});close();page='stage';render();toast('参考搭配已穿好，继续改成你的风格。');return;}
 if(d.lockSlot){store.toggleLock(d.lockSlot);redrawWorn('[data-lock-slot="'+CSS.escape(d.lockSlot)+'"]');return;}
 if(d.removeSlot){store.removeSlot(d.removeSlot);redrawWorn('[data-lock-slot="'+CSS.escape(d.removeSlot)+'"]');return;}
 if(d.openWork){currentWork=d.openWork;store.openWork(d.openWork);page='wardrobe';render();toast('造型已完整还原，可以继续编辑。');return;}
 if(d.renameWork){const w=store.listWorks().find(w=>w.id===d.renameWork);pendingNameAction={kind:'rename',id:w.id};modal('为作品换个名字',`<form id="nameForm"><label class="form-label" for="workName">作品名称</label><input class="name-input" id="workName" value="${esc(w.name)}" maxlength="60" required><div class="form-error" id="nameError" role="alert"></div><div class="dialog-buttons"><button class="btn light" type="button" data-action="close">取消</button><button class="btn dark" type="submit">确认重命名</button></div></form>`);$('#workName').focus();return;}
 if(d.deleteWork){pendingDelete=d.deleteWork;const w=store.listWorks().find(w=>w.id===d.deleteWork);modal('删除这套作品？',`<p class="dialog-copy">“${esc(w.name)}”将从本机作品册移除。已导出的照片不会受到影响，此操作无法撤销。</p><div class="dialog-buttons"><button class="btn light" data-action="close" autofocus>保留作品</button><button class="btn danger" data-action="confirmdelete">确认删除</button></div>`);return;}
 switch(d.action){case'undo':act(store.undo());break;case'redo':act(store.redo());break;case'close':close();break;case'save':openSave();break;case'savecopy':nameSubmit(true);break;case'capture':capture();break;case'themes':openThemes();break;case'themeoff':theme=null;render();break;case'worn':openWorn();break;case'randomgroup':act(store.randomize(category),'已换一组灵感，撤销可恢复。');break;case'randomall':act(store.randomize(),'已随机未锁定部件，撤销一次即可还原。');if($('#dialog').open)redrawWorn('[data-action="randomall"]');break;case'focuslock':focusLocked=!focusLocked;render();toast(focusLocked?'取景已锁定，切换分类时保持当前画面。':'已解锁，面容分类会自动靠近。');break;case'resetview':store.apply({pose:'relaxed'});store.setView({framing:'full'});break;case'fill':store.setView({fill:!s.fill});break;case'clearsearch':query='';renderPanel(s);$('#itemSearch').focus();break;case'confirmbody':store.apply({body:pendingBody});close();toast('角色已切换，穿搭完整保留。');break;case'confirmdelete':if(act(store.deleteWork(pendingDelete),'作品已删除。')){if(currentWork===pendingDelete)currentWork=null;close();render();}break;case'restore':draftDecisionPending=false;if(initialDraft)store.apply(initialDraft.snapshot);else store.restoreDraft();$('#draftBar').hidden=true;close();toast('已继续上次的造型。');break;case'fresh':draftDecisionPending=false;store.freshStart();$('#draftBar').hidden=true;currentWork=null;close();toast('已开始新造型，命名作品仍保留。');break;case'help':modal('几分钟，完成第一套造型',`<ol class="help-list"><li>从左侧选择分类，点击款式即可试穿。面容会自动切换近景，也可锁定取景。</li><li>在“已穿与锁定”中固定喜欢的部件，再随机尝试其他搭配。</li><li>进入拍摄舞台，选择背景、站姿、全身或特写，以及横竖画幅。</li><li>“拍下这一刻”导出 PNG；“保存造型”可以在作品册重新打开编辑。</li></ol><p class="dialog-copy">键盘：Tab 移动焦点，Enter / 空格选择；Ctrl / ⌘ + Z 撤销，Shift + Z 重做，Esc 关闭弹窗。<br>没有自动旋转或闪动效果。</p><button class="btn dark block" data-action="close">开始搭配 →</button>`);break;case'about':modal('先把搭配的乐趣做出来',`<div class="about-stats"><div><b>02</b><span>成年比例角色</span></div><div><b>58</b><span>可切换款式</span></div><div><b>05</b><span>二维场景含衣橱</span></div></div><p class="dialog-copy">这是基于需求文档的二维可玩样段。11 类装扮都能体验，自由搭配、三张邀约、拍照和本机作品册已经连接成完整流程。</p><p class="dialog-copy">本轮使用原创矢量插画，姿态采用二维变化。原文档的 220 款、20 个真实三维舞台、360° 环绕与背面检视，留待画风和操作确认后扩展。</p><p class="dialog-copy">作品保存在当前浏览器；换设备或清理浏览器数据后不会自动同步。二维画面不用于判断真实服装合身与三维穿模。</p><button class="btn dark block" data-action="close">继续创作 →</button>`);break;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')return;if(e.target.matches('input,textarea')||$('#dialog').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)store.redo();else store.undo();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();openSave();}});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();if(!draftDecisionPending)close();});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
window.addEventListener('beforeunload',e=>{if(!store.storageStatus().available&&store.canUndo()){e.preventDefault();e.returnValue='';}});
store.subscribe(render);render();if(draftDecisionPending)showDraftChoice();
})();

</script></body></html>

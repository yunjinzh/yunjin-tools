.teacher-actions .secondary{display:inline-flex;align-items:center;gap:8px}.teacher-actions .icon{width:16px;height:16px}
/* Unit catalogue grows from content metadata; the visual language stays the same. */
.unit-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:6px}
.unit-tabs button{justify-content:flex-start;text-align:left;gap:10px;min-height:66px;padding:12px}
.unit-tab-copy{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.unit-tab-copy strong{font-size:12px;font-weight:650;line-height:1.6}
.unit-tab-copy small{font-size:9px;font-weight:400;color:#829078;line-height:1.5}
.unit-tabs .unit-num{padding:7px;border-radius:8px;flex-shrink:0}
.unit-tab-icon .icon{width:22px;height:22px;opacity:.65}
.unit-tabs button.selected .unit-num{background:var(--green);color:white}
.trail{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}
.trail.trail-wrap{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));row-gap:23px}
.trail-wrap:before{display:none}
.level-card.tone-mint .level-art{background:#eaf1dd}.level-card.tone-mint .level-art svg{stroke:#5a8262}
.level-card.tone-peach .level-art{background:#f7e2cf}.level-card.tone-peach .level-art svg{stroke:#bd8255}
.level-card.tone-yellow .level-art{background:#f8edbc}.level-card.tone-yellow .level-art svg{stroke:#a69442}
.filter-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 22px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.filter-bar label{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-select{font:inherit;color:var(--ink);background:#fffef9;border:1px solid #d7e1cf;border-radius:10px;padding:11px 32px 11px 13px;min-height:44px;max-width:100%}
.filter-select:focus-visible{outline:3px solid #d97642;outline-offset:3px}
.badge-section{margin-top:27px}.badge-section h2{font-size:16px;margin:0 0 15px}
.unit-tabs button.selected{box-shadow:0 3px 6px #2a493011}
@media(max-width:1150px){.unit-tab-copy strong{font-size:11px}.unit-tab-icon{display:none}.unit-tabs button{gap:8px}}
@media(max-width:650px){.unit-tabs button{padding:10px 7px;gap:7px;min-height:69px}.unit-tab-copy strong{font-size:10px}.unit-tab-copy small{font-size:8px}.unit-tabs .unit-num{font-size:9px;padding:5px}.trail{grid-template-columns:repeat(4,minmax(0,1fr))}.trail.trail-wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.section-top .subtle{max-width:108px;text-align:right;line-height:1.7}.level-card h4{font-size:10px;white-space:normal;min-height:28px;line-height:1.4;margin-bottom:3px}.level-card p{white-space:normal;min-height:24px;line-height:1.6}.filter-bar label{font-size:11px}.filter-select{font-size:12px}.filter-bar{font-size:11px}.badge-section h2{font-size:15px}}

 let word=q.word?esc(q.word):'';if(q.char&&q.word)word=Array.from(q.word).map(c=>c===q.char?`<mark>${esc(c)}</mark>`:esc(c)).join('');
 shell(`<div class="game-wrap"><div class="game-head"><button class="round-button" data-action="nav" data-page="home" aria-label="返回地图">${icon('back')}</button><div class="game-progress"><h1>${s.review?'复习背包 · 再发现一次':l.title}</h1><small>${s.review?'把小难题，变成小收获':`第${l.unit}单元 · ${l.sub}`}</small><div class="progress-track" role="progressbar" aria-label="本关进度" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.qs.length}"><span style="width:${s.index/s.qs.length*100}%"></span></div></div><span class="game-count">${s.index+1} / ${s.qs.length}</span></div><div class="game-layout"><section class="question-card" aria-labelledby="q-title"><div class="question-top"><span class="pill">${q.type==='multi'?'多选挑战':q.type==='order'?'词块拼拼乐':q.tag||'知识小挑战'}</span><span class="q-reward">✦ 首次独立答对 +10</span></div><h2 id="q-title" tabindex="-1">${esc(q.prompt)}</h2>${q.context?`<p class="context">${esc(q.context)}</p>`:''}${q.word?`<div class="word-display ${q.word.length>6?'sentence':''}">${q.emoji?`<span style="display:block;font-size:29px;margin-bottom:5px">${q.emoji}</span>`:''}${word}</div>`:''}${options}${s.feedback?`<div class="feedback ${s.feedback.kind}" role="status" aria-live="polite"><strong>${s.feedback.title}</strong>${esc(s.feedback.text)}${s.solved?`<div class="feedback-foot">${s.feedback.clean?'这份发现属于认真思考的你。':'已经加入复习背包，下次独立答对就能巩固它。'}</div>`:''}</div>`:''}<div class="submit-row"><button class="hint-button" data-action="hint" ${s.solved?'disabled':''}>${icon('lamp')}${s.hinted?'再看一次线索':'小芽，给我一点线索'}</button>${s.solved?`<button class="primary" data-action="next">${s.index===s.qs.length-1?'收下我的收获':'下一个发现'} ${icon('arrow')}</button>`:`<button class="primary" data-action="submit" ${chosen.length===0||(q.type==='order'&&chosen.length!==count)?'disabled':''}>检查答案 ${icon('check')}</button>`}</div></section><aside class="companion">${owl()}<div class="speech">${s.solved?'你又发现了一个小知识！<br>读一读讲解，让它记得更牢。':s.attempts?'没关系，线索就在题目里。<br>再想一想，你可以的。':'我是小芽，你的探索伙伴。<br>不用抢时间，认真想最重要。'}</div><div class="session-stat"><span>本次探索值</span><b>✦ ${s.gain}</b></div><div class="session-stat"><span>独立答对</span><b>${s.correct} 题</b></div><div class="session-stat"><span>成长称号</span><b>${rank()}</b></div></aside></div></div>`);}
function remember(id){if(!state.mistakes.includes(id))state.mistakes.push(id);}
function submit(){if(!session||session.solved)return;const q=currentQ(),s=session;if(!s.selected.length||(q.type==='order'&&s.selected.length!==q.answer.length))return;
 const ok=q.type==='order'?JSON.stringify(s.selected)===JSON.stringify(q.answer):q.type==='multi'?JSON.stringify([...s.selected].sort((a,b)=>a-b))===JSON.stringify([...q.answer].sort((a,b)=>a-b)):s.selected[0]===q.answer;
 if(ok){s.solved=true;const clean=s.attempts===0&&!s.hinted;const value=clean?10:5;let gained=Math.max(0,value-(state.best[q.id]||0));state.best[q.id]=Math.max(value,state.best[q.id]||0);s.gain+=gained;if(clean){s.correct++;if(state.mistakes.includes(q.id)){state.mistakes=state.mistakes.filter(x=>x!==q.id);if(s.review){state.reviewed++;s.fixed++;}}}else{remember(q.id);state.retries++;}let ids=state.daily[today()]||[];if(!ids.includes(q.id))ids.push(q.id);state.daily[today()]=ids;if(ids.length>=5&&!state.dailyClaimed[today()]){state.dailyClaimed[today()]=true;setTimeout(()=>toast('今日小目标达成！获得一枚好奇心印章 ☀'),350);}s.feedback={kind:'correct',title:clean?`发现正确！${gained?`探索值 +${gained}`:'这个知识记得很牢'}`:`订正成功，进步值得奖励！${gained?`+${gained}`:''}`,text:q.explain,clean};tone(true);save();}
 else{s.attempts++;remember(q.id);save();s.feedback={kind:'retry',title:s.attempts===1?'再想一想，你已经离答案更近了。':'一起把这个知识弄明白。',text:s.attempts>=2?`正确答案：${answerText(q)}。${q.explain} 请按正确答案再试一次。`:q.hint};tone(false);}
 renderGame();}
function hint(){if(!session||session.solved)return;session.hinted=true;session.feedback={kind:'hint',title:'小芽的线索',text:currentQ().hint};renderGame();}
function finish(){const s=session;s.rating=s.correct/s.qs.length>=.85?3:s.correct/s.qs.length>=.6?2:1;if(!s.review){const old=state.completed[s.level]||0;state.completed[s.level]=Math.max(old,s.rating);if(!old)s.justEarned.push(LEVELS.find(l=>l.id===s.level).badge);if(LEVELS.every(l=>state.completed[l.id]))state.achievements.allIslands=true;}save();page='result';render();celebrate();}
function renderResult(){const s=session,l=LEVELS.find(l=>l.id===s.level);shell(`<section class="result">${s.review?icon('bag'):`<div class="badge-medal" style="background:#ffebaf;color:#b88636">${icon(l.icon)}</div>`}<div class="eyebrow" style="justify-content:center;margin-top:20px">${s.review?'每次复习，都在向前':'一段冒险，满满收获'}</div><h1>${s.review?'小知识，更熟悉了！':`${l.title}，探索完成！`}</h1>${s.review?'':`<div class="big-stars" aria-label="本次获得${s.rating}颗星">${starsHTML(s.rating)}</div>`}<p>${s.justEarned.length?`获得「${esc(s.justEarned[0])}」徽章！<br>`:''}${s.review?`你独立掌握了 ${s.fixed} 个背包里的小知识。`:'你完成了这次挑战，每一次认真思考都值得被看见。'}<br>${s.rating<3?'把小难题再练一练，下次还能点亮更多星星。':'带着这份好奇，去看看下一个发现吧。'}</p><div class="result-stats"><div><b>${s.qs.length}</b><small>完成任务</small></div><div><b>${s.correct}</b><small>首次独立答对</small></div><div><b>+${s.gain}</b><small>新增探索值</small></div></div><div class="result-actions"><button class="secondary" data-action="nav" data-page="home">回到冒险地图</button>${state.mistakes.length?'<button class="primary" data-action="review-start">打开复习背包 →</button>':`<button class="primary" data-action="next-level">${LEVELS.every(l=>state.completed[l.id])?'查看全部成就':'继续探索'} →</button>`}</div><p style="font-size:10px;margin:22px 0 0">${s.review?'本次复习的奖励按掌握程度更新，已掌握的题目不会重复加分。':'独立答对率 ≥85%：3 星；≥60%：2 星；其余完成挑战：1 星。保留最好成绩。'}</p></section>`);}
function renderReview(){const reviewIds=state.mistakes.filter(id=>!reviewFilter||LEVELS.find(l=>l.id===QUESTIONS.find(q=>q.id===id).level).unit===reviewFilter);shell(`<h1 class="page-title">我的复习背包</h1><p class="page-desc">小难题不是绊脚石，是下一次进步的起点。独立答对后，就能把它从背包里送回知识岛。</p><div class="filter-bar"><label>选择复习范围 ${unitFilter('review-filter',reviewFilter)}</label><span>${reviewIds.length} 个待巩固知识</span></div>${reviewIds.length?`<div class="action-line"><span class="pill">${reviewIds.length} 个知识等待巩固</span><button class="primary" data-action="review-start" data-scope="${reviewFilter}">开始复习 ${icon('arrow')}</button></div><div class="review-list">${reviewIds.map(id=>{const q=QUESTIONS.find(q=>q.id===id),l=LEVELS.find(l=>l.id===q.level);return `<article class="review-item"><small>第${l.unit}单元 · ${l.title}</small><h3>${esc(q.prompt)}${q.word?`<br><span style="color:#6d8a58">${esc(q.word)}</span>`:''}</h3><details><summary>翻开知识小卡</summary><p><b>答案：${esc(answerText(q))}</b><br>${esc(q.explain)}</p></details></article>`;}).join('')}</div>`:`<div class="empty">${icon('bag')}<h2>背包轻轻，好奇满满。</h2><p>${reviewFilter?'这个单元':'现在'}没有待复习的小难题。<br>去岛上逛逛，遇到需要巩固的知识，小芽会帮你收好。</p><button class="primary" data-action="nav" data-page="home">出发去探险 ${icon('arrow')}</button></div>`}`);}
function badgeData(){return [...LEVELS.map(l=>({unit:l.unit,name:l.badge,icon:l.icon,earned:!!state.completed[l.id],desc:`完成「${l.title}」`})),...UNITS.map(u=>({unit:u.id,name:u.badge,icon:u.icon,earned:unitLevels(u.id).every(l=>state.completed[l.id]),desc:`完成${u.label}全部 ${u.levelCount} 个关卡`})),{name:'坚持小勇士',icon:'shield',earned:state.retries>0,desc:'看过提示或答错后，成功订正 1 题'},{name:'复习小达人',icon:'bag',earned:state.reviewed>0,desc:'在复习背包中独立答对 1 题'},{name:'今日好奇心',icon:'sun',earned:!!state.dailyClaimed[today()],desc:'今天完成 5 个不同的小任务'},{name:'全岛探索家',icon:'map',earned:!!state.achievements.allIslands,desc:state.achievements.allIslands?'曾完成全部开放关卡，新冒险也会保留这份荣誉。':`完成当前全部 ${STATS.levelCount} 个关卡`}];}

function renderTeacher(){shell(`<h1 class="page-title">把“做练习”，变成主动探索。</h1><p class="page-desc">为四年级上册 ${UNITS.length} 个单元设计。用短目标、即时反馈和再次尝试，让孩子看见自己的进步。</p><div class="teacher-grid"><section class="teacher-card"><h2>一节 15 分钟的小冒险</h2><ol><li><b>2 分钟 · 唤起好奇：</b>投屏地图，让孩子预测今天会遇到哪些多音字。</li><li><b>8 分钟 · 自主探索：</b>选 1–2 个关卡；先独立思考，再请同桌说明判断依据。</li><li><b>3 分钟 · 订正复习：</b>打开复习背包，用自己的话解释“为什么”。</li><li><b>2 分钟 · 分享发现：</b>请孩子分享一个新发现、一个好问题或一次成功的订正。</li></ol><p>全部 ${STATS.levelCount} 个关卡都可以直接进入，方便您按教学进度选择。</p></section><section class="teacher-card"><h2>让奖励服务于学习</h2><p><b>反馈具体：</b>选完后点击“检查答案”，答对解释知识点；首次答错给线索，再次答错展示答案与解析，仍需完成订正。</p><p><b>鼓励成长：</b>首次独立答对计 10 探索值；有提示或重试后答对计 5。每题只保留最高值，反复点选不会累加奖励。</p><p><b>支持内驱力：</b>不限时、不扣生命值、不设排行榜。完成关卡必得徽章和至少 1 星，订正与复习也有成就。</p></section><section class="teacher-card wide"><div class="section-top"><h2>当前浏览器的学习记录</h2><span class="subtle">${completedCount()} / ${STATS.questionCount} 个任务已完成</span></div><p>记录属于当前设备、当前浏览器，刷新后保留。用于个人练习或课堂共同闯关；不收集姓名，不是班级学生成绩汇总。</p><div class="filter-bar"><label>查看学习记录 ${unitFilter('teacher-filter',teacherFilter)}</label></div><div class="table-scroll"><table><thead><tr><th>单元 / 关卡</th><th>完成任务</th><th>已掌握（10 分）</th><th>待巩固</th><th>最高星级</th></tr></thead><tbody>${LEVELS.filter(l=>!teacherFilter||l.unit===teacherFilter).map(l=>{const qs=levelQs(l.id);return `<tr><td>${l.unit} · ${l.title}</td><td>${qs.filter(q=>state.best[q.id]).length} / ${qs.length}</td><td>${qs.filter(q=>state.best[q.id]===10&&!state.mistakes.includes(q.id)).length}</td><td>${qs.filter(q=>state.mistakes.includes(q.id)).length}</td><td style="color:#c69b48">${'★'.repeat(state.completed[l.id]||0)||'—'}</td></tr>`;}).join('')}</tbody></table></div><div class="teacher-actions"><button class="secondary small" data-action="export">导出学习记录 ${icon('download')}</button><button class="secondary small danger" data-action="reset">重置本机进度</button></div></section><section class="teacher-card"><h2>题目从哪里来？</h2><p>依据您提供的 ${UNITS.length} 份单元练习改编，共 ${STATS.questionCount} 个互动任务。</p>${ function exportReport(){let report=['语文探险岛 · 本机学习记录',`导出时间：${new Date().toLocaleString('zh-CN')}`,`探索值：${xp()}　星星：${stars()} / ${STATS.maxStars}`,`已完成：${completedCount()} / ${STATS.questionCount}　待巩固：${state.mistakes.length}`,'','单元与关卡\t完成题数\t独立掌握\t待巩固\t最高星级'];for(const l of LEVELS){let qs=levelQs(l.id);report.push(`${l.unit} · ${l.title}\t${qs.filter(q=>state.best[q.id]).length}/${qs.length}\t${qs.filter(q=>state.best[q.id]===10&&!state.mistakes.includes(q.id)).length}\t${qs.filter(q=>state.mistakes.includes(q.id)).length}\t${state.completed[l.id]||0}`);}report.push('','待巩固知识点');for(const id of state.mistakes){const q=QUESTIONS.find(q=>q.id===id);report.push(`${q.prompt} ${q.word||''}\n参考答案：${answerText(q)}\n解析：${q.explain}\n`);}report.push('','说明：这是当前设备浏览器的练习记录，不是班级成绩汇总。');let url=URL.createObjectURL(new Blob(['\ufeff'+report.join('\n')],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='语文探险岛-学习记录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出。');}

 if(a==='unpick'&&session&&!session.solved){session.selected.splice(Number(b.dataset.pos),1);renderGame();document.querySelector('.tile-bank .tile:not(:disabled)')?.focus({preventScroll:true});}
 if(a==='submit')submit();

 if(a==='next'&&session?.solved){if(session.index===session.qs.length-1)finish();else{Object.assign(session,{index:session.index+1,attempts:0,hinted:false,selected:[],solved:false,feedback:null});renderGame();document.getElementById('q-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}}
 if(a==='close')document.getElementById('modal').close();

 if(a==='review-start')start(null,true,Number(b.dataset.scope)||0);
 if(a==='next-level'){let l=unitLevels(unit).find(l=>!state.completed[l.id])||LEVELS.find(l=>!state.completed[l.id]);if(l){unit=l.unit;state.unit=unit;save();start(l.id);}else{page='badges';render();}}
 if(a==='export')exportReport();
 if(a==='reset')openDialog('重新开始一段冒险？','这会清除当前浏览器里的探索值、星星、徽章和复习背包，无法恢复。您可以先取消并导出学习记录。','<button class="secondary" data-action="close">保留记录</button><button class="primary" data-action="confirm-reset">确认重置</button>');
 if(a==='confirm-reset'){state=fresh();unit=UNITS[0].id;reviewFilter=0;teacherFilter=0;session=null;save();document.getElementById('modal').close();render();toast('已重置，可以开始新的冒险了。');}
 });
document.addEventListener('change',e=>{
 const action=e.target.dataset?.action,id=Number(e.target.value);
 if(id!==0&&!unitMeta(id))return;
 if(action==='review-filter'){reviewFilter=id;renderReview();}
 if(action==='teacher-filter'){teacherFilter=id;renderTeacher();}
});
document.addEventListener('keydown',e=>{
 if(e.target.getAttribute?.('role')!=='tab')return;
 const index=UNITS.findIndex(u=>u.id===unit);
 const next=e.key==='ArrowRight'?(index+1)%UNITS.length:e.key==='ArrowLeft'?(index-1+UNITS.length)%UNITS.length:e.key==='Home'?0:e.key==='End'?UNITS.length-1:-1;
 if(next<0)return;e.preventDefault();unit=UNITS[next].id;state.unit=unit;save();renderHome();document.getElementById('unit-tab-'+unit)?.focus({preventScroll:true});
});
save();
render();
</script>
</body></html>

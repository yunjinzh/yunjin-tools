<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173aa8">
  <meta name="description" content="选择精确到哪一位，随机练习四舍五入，即时查看答案和解题过程。">
  <title>四舍五入练习 · 数学小练习</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173aa8'/%3E%3Ctext x='32' y='45' fill='white' text-anchor='middle' font-family='sans-serif' font-size='38' font-weight='800'%3E5%3C/text%3E%3C/svg%3E">
  <style>
    :root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;color:#142657;background:#f3f6ff;font-size:16px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
    .shell{max-width:1180px;margin:auto;padding:30px 28px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-size:1.1rem;font-weight:850;letter-spacing:.02em}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#173aa8;color:#fff;font-size:1.65rem;line-height:1;box-shadow:0 6px 0 #cdd8ff}.top-note{font-size:.9rem;color:#6b7798}
    h1,h2,p{margin:0}.intro{margin:0 0 23px}.intro h1{font-size:clamp(1.7rem,3.4vw,2.6rem);letter-spacing:-.04em;line-height:1.2}.intro p{margin-top:8px;color:#677392;font-size:1rem}
    .grid{display:grid;grid-template-columns:306px minmax(0,1fr);gap:20px;align-items:start}.panel,.practice{background:white;border:1px solid #e1e7f5;border-radius:22px;box-shadow:0 14px 40px rgba(27,52,116,.055)}.panel{padding:24px}.panel h2{font-size:1.05rem;margin-bottom:20px}.field-label{display:block;font-weight:750;font-size:.94rem;margin-bottom:11px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{border:1.5px solid #dce3f4;background:#fff;border-radius:11px;min-height:45px;color:#34456f;font-weight:700}.choice:hover{border-color:#5573d6}.choice[aria-pressed="true"]{background:#eaf0ff;border-color:#2c56d9;color:#123ba7;box-shadow:inset 0 0 0 1px #2c56d9}.divider{height:1px;background:#e9edf7;margin:23px 0}.count-choices{display:flex;gap:8px}.count-choices .choice{flex:1}.primary,.secondary{border:0;border-radius:12px;font-weight:800;min-height:49px;padding:0 20px;transition:transform .15s,box-shadow .15s}.primary{background:#2150d4;color:#fff;box-shadow:0 5px 0 #153793}.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 #153793}.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #153793}.secondary{background:#eaf0ff;color:#2143a5}.secondary:hover:not(:disabled){background:#dbe6ff}.wide{width:100%;margin-top:26px}.hint{font-size:.81rem;line-height:1.55;color:#7884a3;margin-top:13px}
    .practice{min-height:485px;padding:32px 38px 36px;position:relative;overflow:hidden}.practice:before{content:"";position:absolute;right:-80px;top:-100px;width:235px;height:235px;border:40px solid #eff3ff;border-radius:50%;pointer-events:none}.practice>*{position:relative}.progress-head{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#506183;font-size:.91rem;font-weight:700}.score{border-radius:99px;background:#f0f5ff;color:#2649ad;padding:8px 13px}.track{height:8px;background:#edf1fa;border-radius:99px;overflow:hidden;margin-top:16px}.fill{height:100%;background:#2e59dc;border-radius:99px;transition:width .3s ease}.question-kicker{display:inline-flex;margin-top:52px;border-radius:7px;background:#fff0ce;color:#8c5800;padding:7px 10px;font-size:.87rem;font-weight:800}.question{font-size:clamp(1.65rem,3.7vw,2.6rem);line-height:1.5;letter-spacing:-.025em;font-weight:800;margin:16px 0 26px;overflow-wrap:anywhere}.number{color:#1749d4;font-variant-numeric:tabular-nums;white-space:nowrap}.answer-label{display:block;font-size:.96rem;font-weight:750;margin-bottom:10px}.answer-row{display:flex;gap:10px;max-width:560px}.answer-row input{min-width:0;flex:1;border:2px solid #c9d5f1;border-radius:12px;height:53px;padding:0 16px;font-size:1.2rem;font-weight:700;color:#142657;outline:none;background:#fff;font-variant-numeric:tabular-nums}.answer-row input:focus{border-color:#2658d8;box-shadow:0 0 0 4px #e4ecff}.answer-row .primary{min-width:104px}.feedback{border-radius:15px;margin-top:27px;padding:18px 20px;max-width:650px;line-height:1.65}.feedback.correct{background:#e8f7f0;border:1px solid #9ad9b7;color:#15523b}.feedback.incorrect{background:#fff3e4;border:1px solid #f0c78a;color:#744319}.feedback strong{font-size:1.08rem}.feedback p{margin-top:5px}.feedback .next{margin-top:14px}.feedback .digit{display:inline-block;border-radius:5px;background:#ffce6d;padding:0 4px;color:#553200;font-weight:800}.error{color:#ae332d;min-height:23px;margin-top:9px;font-size:.9rem}.result{text-align:center;padding:62px 10px 36px}.result-icon{width:90px;height:90px;border-radius:23px;background:#ffcf67;color:#513b10;display:grid;place-items:center;font-size:2.9rem;font-weight:900;margin:0 auto 22px;transform:rotate(-5deg)}.result h2{font-size:2rem}.result p{margin:12px 0 26px;color:#596a8e;font-size:1.1rem}.result .primary{min-width:180px}
    .mini-guide{display:flex;gap:12px;align-items:flex-start;margin-top:21px;padding:17px 21px;border-radius:15px;background:#e8edfb;color:#4c5d83;font-size:.93rem;line-height:1.55}.mini-guide b{color:#1c42a8;white-space:nowrap}
    @media(max-width:780px){.shell{padding:22px 16px 40px}.top{margin-bottom:25px}.top-note{display:none}.grid{grid-template-columns:1fr}.panel{padding:20px}.practice{padding:25px 20px;min-height:430px}.question-kicker{margin-top:40px}.intro p{font-size:.94rem}.panel .divider{margin:17px 0}.wide{margin-top:20px}.mini-guide{display:block}.mini-guide b{display:block;margin-bottom:5px}}
    @media(max-width:420px){.question{font-size:1.65rem}.answer-row{flex-wrap:wrap}.answer-row input{flex-basis:100%}.answer-row .primary{width:100%}.practice{min-height:490px}.choices{gap:6px}.choice{min-height:43px}.shell{padding-left:12px;padding-right:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark" aria-hidden="true">≈</span> 数学小练习</div><span class="top-note">看下一位 · 满五进一</span></header>
    <div class="intro"><h1>四舍五入，来做几题！</h1><p>选择保留位数，看看你能答对多少题。</p></div>
    <div class="grid">
      <section class="panel" aria-labelledby="settings-title">
        <h2 id="settings-title">练习设置</h2>
        <span class="field-label" id="place-label">精确到哪一位</span>
        <div class="choices" role="group" aria-labelledby="place-label" id="places">
          <button type="button" class="choice" data-place="thousand">千位</button><button type="button" class="choice" data-place="hundred">百位</button><button type="button" class="choice" data-place="ten">十位</button><button type="button" class="choice" data-place="one">个位</button><button type="button" class="choice" data-place="tenth">十分位</button><button type="button" class="choice" data-place="hundredth">百分位</button>
        </div>
        <div class="divider"></div>
        <span class="field-label" id="count-label">每组题数</span>
        <div class="count-choices" role="group" aria-labelledby="count-label" id="counts"><button type="button" class="choice" data-count="5">5 题</button><button type="button" class="choice" data-count="10">10 题</button><button type="button" class="choice" data-count="20">20 题</button></div>
        <button type="button" class="primary wide" id="start">开始新一组</button>
        <p class="hint">更改设置后点击“开始新一组”，当前进度会重新开始。</p>
      </section>
      <div>
        <section class="practice" aria-label="练习题" id="practice"></section>
        <div class="mini-guide"><b>小诀窍</b><span>找到要保留的数位，再看它右边紧挨着的一位：0～4 舍去，5～9 向前进一。</span></div>
      </div>
    </div>
  </main>
  <script>
  (()=>{
    const places={thousand:{label:'千位',unit:1000000,decimals:0},hundred:{label:'百位',unit:100000,decimals:0},ten:{label:'十位',unit:10000,decimals:0},one:{label:'个位',unit:1000,decimals:0},tenth:{label:'十分位',unit:100,decimals:1},hundredth:{label:'百分位',unit:10,decimals:2}};
    const $=s=>document.querySelector(s), random=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const state={place:'ten',count:10,activePlace:'ten',activeCount:10,items:[],index:0,score:0,revealed:false};
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function valueText(units,decimals){return (units/1000).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});}
    function makeQuestion(place){
      let source,sourceDecimals=0;
      if(place==='thousand') source=random(1000,99999)*1000;
      else if(place==='hundred') source=random(100,9999)*1000;
      else if(place==='ten') source=random(10,9999)*1000;
      else if(place==='one'){source=random(10,9999)*1000+random(1,99)*10;sourceDecimals=2;}
      else if(place==='tenth'){source=random(1,999)*1000+random(0,99)*10;sourceDecimals=2;}
      else {source=random(1,999)*1000+random(0,999);sourceDecimals=3;}
      const unit=places[place].unit;
      const nextDigit=Math.floor((source%unit)/(unit/10));
      const rounded=Math.floor((source+unit/2)/unit)*unit;
      return {source,sourceDecimals,nextDigit,rounded};
    }
    function renderChoices(){document.querySelectorAll('[data-place]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.place===state.place));document.querySelectorAll('[data-count]').forEach(el=>el.setAttribute('aria-pressed',Number(el.dataset.count)===state.count));}
    function newSession(){state.activePlace=state.place;state.activeCount=state.count;state.items=Array.from({length:state.activeCount},()=>makeQuestion(state.activePlace));state.index=0;state.score=0;state.revealed=false;render();$('#answer')?.focus();}
    function render(){
      const root=$('#practice');
      if(state.index>=state.activeCount){root.innerHTML=`<div class="result"><div class="result-icon" aria-hidden="true">★</div><h2>完成这一组！</h2><p>答对了 <strong>${state.score}</strong> / ${state.activeCount} 题</p><button type="button" class="primary" id="again">再练一组</button></div>`;$('#again').addEventListener('click',newSession);return;}
      const q=state.items[state.index],config=places[state.activePlace];
      root.innerHTML=`<div class="progress-head"><span>第 ${state.index+1} / ${state.activeCount} 题</span><span class="score">已答对 ${state.score} 题</span></div><div class="track" role="progressbar" aria-label="做题进度" aria-valuenow="${state.index}" aria-valuemin="0" aria-valuemax="${state.activeCount}"><div class="fill" style="width:${state.index/state.activeCount*100}%"></div></div><span class="question-kicker">精确到${config.label}</span><div class="question"><span class="number">${valueText(q.source,q.sourceDecimals)}</span><br>四舍五入后是多少？</div><form id="answer-form" novalidate><label class="answer-label" for="answer">填写你的答案</label><div class="answer-row"><input id="answer" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="在这里输入数字" aria-describedby="input-error"><button class="primary" type="submit">提交答案</button></div><div class="error" id="input-error" role="alert"></div></form><div id="feedback" aria-live="polite"></div>`;
      $('#answer-form').addEventListener('submit',checkAnswer);
    }
    function parseAnswer(text){const cleaned=text.trim().replace(/[，,\s]/g,'').replace(/．/g,'.').replace(/－/g,'-');if(!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned))return null;const [whole,frac='']=cleaned.split('.');if(frac.length>3||whole.length>10)return null;return Number(whole||0)*1000+Number(frac.padEnd(3,'0'));}
    function checkAnswer(event){event.preventDefault();if(state.revealed)return;const input=$('#answer'),result=parseAnswer(input.value);if(result===null){$('#input-error').textContent='请输入有效的非负数字，例如 120 或 12.5。';input.focus();return;}
      const q=state.items[state.index],config=places[state.activePlace],correct=result===q.rounded;state.revealed=true;if(correct)state.score++;
      const right=valueText(q.rounded,config.decimals);
      $('#answer-form').remove();
      $('#feedback').innerHTML=`<div class="feedback ${correct?'correct':'incorrect'}"><strong>${correct?'答对啦！':'再看一看，正确答案是 '+right}</strong><p>精确到${config.label}，看它右边紧挨着的一位 <span class="digit">${q.nextDigit}</span>。${q.nextDigit>=5?'满 5，向前进一。':'小于 5，直接舍去。'}所以 ${valueText(q.source,q.sourceDecimals)} ≈ <b>${right}</b>。</p><button class="secondary next" type="button" id="next">${state.index+1===state.activeCount?'查看成绩':'下一题'}</button></div>`;
      $('#next').addEventListener('click',()=>{state.index++;state.revealed=false;render();$('#answer')?.focus();});$('#next').focus();
    }
    $('#places').addEventListener('click',e=>{const b=e.target.closest('[data-place]');if(b){state.place=b.dataset.place;renderChoices();}});
    $('#counts').addEventListener('click',e=>{const b=e.target.closest('[data-count]');if(b){state.count=Number(b.dataset.count);renderChoices();}});
    $('#start').addEventListener('click',newSession);
    renderChoices();newSession();
    if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'start_rounding_practice',title:'开始四舍五入练习',description:'按指定数位和题数开启新一组练习，并显示第一题。',inputSchema:{type:'object',properties:{place:{type:'string',enum:Object.keys(places)},count:{type:'integer',enum:[5,10,20]}},required:['place','count'],additionalProperties:false},annotations:{readOnlyHint:false},execute:({place,count})=>{if(!places[place]||![5,10,20].includes(count))throw Error('无效的练习设置');state.place=place;state.count=count;renderChoices();newSession();return {place,count,firstQuestion:valueText(state.items[0].source,state.items[0].sourceDecimals)};}})).catch(()=>{});}catch{}}
  })();
  </script>
</body>
</html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然资源·视界 · 卡片封面生成器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --accent: #E07563;
    --accent-dark: #C45A48;
    --base: #F1F0EC;
    --base-dark: #E8E6E0;
    --ink: #1A1A1A;
    --ink-mid: #3D3D3D;
    --ink-light: #7A7A7A;
    --rule: #C8C4BC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #DDDBD4;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── 顶部 Header ── */
  .app-header {
    background: var(--ink);
    padding: 18px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--accent);
  }
  .header-left { display: flex; align-items: baseline; gap: 16px; }
  .header-logo {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--base);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header-sub {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 2px;
  }
  .header-count {
    font-family: 'Oswald', sans-serif;
    font-weight: 200;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* ── 工具栏 ── */
  .toolbar {
    background: var(--base);
    padding: 12px 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 200;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .toolbar-label {
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .toolbar input, .toolbar select {
    padding: 7px 12px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px;
    background: var(--base);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar input[type="text"] { width: 200px; }
  .btn {
    padding: 7px 16px;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-dark { background: var(--ink); color: var(--base); }
  .btn-dark:hover { background: #333; }
  .btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; }
  .stats-badge {
    margin-left: auto;
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 1px;
  }

  /* ── 新增输入面板 ── */
  .add-panel {
    background: var(--base-dark);
    border-bottom: 1px solid var(--rule);
    padding: 0 48px;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.4s ease, padding 0.3s;
  }
  .add-panel.open { max-height: 300px; padding: 20px 48px; }
  .add-panel-inner {
    display: grid;
    grid-template-columns: 80px 1fr 1fr 160px 120px auto;
    gap: 12px;
    align-items: end;
  }
  .field-group { display: flex; flex-direction: column; gap: 5px; }
  .field-label {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-light);
  }
  .field-input {
    padding: 8px 10px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    background: var(--base);
    color: var(--ink);
    outline: none;
    width: 100%;
  }
  .field-input:focus { border-color: var(--accent); }
  .add-hint {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px;
    color: var(--ink-light);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }

  /* ── 主内容区 ── */
  .main { padding: 32px 48px 64px; }
  .section-rule {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .section-rule-text {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-light);
    white-space: nowrap;
  }
  .section-rule-line { flex: 1; height: 1px; background: var(--rule); }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 28px;
  }

  /* ── 卡片包装 ── */
  .card-wrapper { display: flex; flex-direction: column; gap: 8px; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px;
  }
  .card-meta-period {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink-light);
    flex: 1;
  }
  .ratio-toggle { display: flex; gap: 3px; }
  .ratio-btn {
    padding: 3px 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1px;
    border: 1px solid var(--rule);
    border-radius: 1px;
    cursor: pointer;
    background: var(--base);
    color: var(--ink-light);
    transition: all 0.15s;
  }
  .ratio-btn.active { background: var(--ink); color: var(--base); border-color: var(--ink); }
  .ratio-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .save-btn {
    padding: 4px 10px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 1px solid var(--rule);
    border-radius: 1px;
    cursor: pointer;
    background: var(--base);
    color: var(--ink-light);
    transition: all 0.15s;
  }
  .save-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .del-btn {
    padding: 4px 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    border: 1px solid #ddd;
    border-radius: 1px;
    cursor: pointer;
    background: transparent;
    color: #bbb;
    transition: all 0.15s;
  }
  .del-btn:hover { background: #fee; color: #c00; border-color: #c00; }

  /* ── 进度条 ── */
  #progressBar {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    border-radius: 2px;
    padding: 16px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    z-index: 9999;
    min-width: 260px;
    border-left: 3px solid var(--accent);
  }
  #progressText {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--base);
    margin-bottom: 10px;
  }
  .prog-track { height: 2px; background: #333; }
  .prog-fill { height: 100%; background: var(--accent); transition: width 0.3s; width: 0%; }
</style>
</head>

<!-- SVG 噪点滤镜定义 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
</svg>

<!-- Header -->
<div class="app-header">
  <div class="header-left">
    <div class="header-logo">自然资源·视界</div>
    <div class="header-sub">NATURAL RESOURCES · VISION</div>
  </div>
  <div class="header-count" id="headerCount">— 138 ISSUES —</div>
</div>

    <option value="urban">城市更新</option>
    <option value="spatial">国土空间</option>
    <option value="rural">乡村</option>

  <div class="stats-badge" id="statsText">138 / 138</div>
</div>

<!-- 新增输入面板 -->
<div class="add-panel" id="addPanel">

      <span class="field-label">期数</span>
      <input class="field-input" id="newPeriod" placeholder="141" type="text">
    </div>
    <div class="field-group">
      <span class="field-label">标题</span>
      <input class="field-input" id="newTitle" placeholder="请输入讲座标题…" type="text">
    </div>
    <div class="field-group">
      <span class="field-label">作者</span>
      <input class="field-input" id="newAuthor" placeholder="姓名" type="text">
    </div>
    <div class="field-group">
      <span class="field-label">主题分类</span>
      <select class="field-input" id="newTheme">
        <option value="tourism">旅游</option>
        <option value="agriculture">农业/粮食</option>
        <option value="ecology">生态/自然</option>
        <option value="urban">城市更新</option>
        <option value="spatial" selected>国土空间</option>
        <option value="rural">乡村</option>
        <option value="ocean">海洋</option>
        <option value="digital">数字化</option>
        <option value="green">绿色/可持续</option>
        <option value="governance">治理/制度</option>
        <option value="water">水资源</option>
        <option value="research">科研</option>
        <option value="general">综合</option>
      </select>
    </div>
    <div class="field-group">
      <span class="field-label">版式</span>
      <select class="field-input" id="newRatio">
        <option value="16-9">16:9</option>
        <option value="4-3">4:3</option>
      </select>
    </div>
    <div class="field-group">
      <span class="field-label">&nbsp;</span>
      <button class="btn btn-accent" onclick="addNewCard()" style="height:36px;white-space:nowrap">生成卡片</button>
    </div>
  </div>
  <div class="add-hint">提示：填写期数、标题、作者后点击「生成卡片」，新卡片将置顶显示，可单独保存为 PNG。</div>
</div>

<!-- Main -->
<div class="main">
  <div class="section-rule">
    <span class="section-rule-text">Card Gallery</span>
    <div class="section-rule-line"></div>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- 进度条 -->
<div id="progressBar">
  <div id="progressText">Generating…</div>
  <div class="prog-track"><div class="prog-fill" id="progressFill"></div></div>
</div>

  /* ═══════════════════════════════════════════
     卡片生成核心
  ═══════════════════════════════════════════ */
  function createCard(entry, ratio) {
    const aspectStyle = ratio === '4-3' ? 'aspect-ratio:4/3' : 'aspect-ratio:16/9';
    const p = THEME_PALETTE[entry.theme] || THEME_PALETTE.general;
    const labelEN = (THEME_LABELS[entry.theme] || '').split('·')[1]?.trim() || '';
    const periodNum = entry.period;

    return `<div id="card-${entry.period}" style="
        width:100%;${aspectStyle};
        position:relative;overflow:hidden;
        border-radius:3px;
        box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3);
        font-family:'Noto Sans SC',sans-serif;
        background:${p.bg};
      ">
      <!-- 噪点纹理层 -->
      <div style="position:absolute;inset:0;z-index:10;pointer-events:none;
        background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/><feColorMatrix type=%22saturate%22 values=%220%22/></filter><rect width=%22200%22 height=%22200%22 filter=%22url(%23n)%22 opacity=%220.08%22/></svg>');
        mix-blend-mode:multiply;opacity:0.6;">
      </div>

      <!-- 左侧竖向色条 -->
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${p.accent};z-index:5;"></div>

      <!-- 右侧面板底色 -->
      <div style="position:absolute;right:0;top:0;bottom:0;width:45%;background:${p.panel};z-index:1;opacity:0.6;"></div>

      <!-- 主题几何装饰 SVG -->
      <svg style="position:absolute;inset:0;width:100%;height:100%;z-index:2;color:${p.accent}"
        viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
        ${getThemeSVG(entry.theme)}
      </svg>

      <!-- 顶部水平分割线 -->
      <div style="position:absolute;top:14%;left:5%;right:5%;height:1px;background:${p.accent};opacity:0.25;z-index:6;"></div>

      <!-- 内容层 -->
      <div style="position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;padding:5% 6%;">

        <!-- 顶栏 -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:auto;">
          <div>
            <div style="font-family:'Oswald',sans-serif;font-weight:200;font-size:clamp(9px,1.1vw,12px);
              letter-spacing:3px;text-transform:uppercase;color:${p.accent};margin-bottom:3px;">
              自然资源·视界
            </div>
            <div style="font-family:'Oswald',sans-serif;font-weight:200;font-size:clamp(8px,0.9vw,10px);
              letter-spacing:2px;color:rgba(255,255,255,0.35);">
              NATURAL RESOURCES · VISION
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(28px,5vw,56px);
              line-height:0.9;color:rgba(255,255,255,0.06);letter-spacing:-2px;margin-top:-4px;">
              ${periodNum}
            </div>
          </div>
        </div>

        <!-- 中部弹性空间 -->
        <div style="flex:1;min-height:8%;"></div>

        <!-- 期号标签 -->
        <div style="margin-bottom:4%;">
          <span style="
            display:inline-block;
            font-family:'Oswald',sans-serif;font-weight:500;
            font-size:clamp(9px,1vw,11px);letter-spacing:2px;

          font-family:'Noto Serif SC',serif;font-weight:900;

  /* ═══════════════════════════════════════════
     状态与渲染
  ═══════════════════════════════════════════ */
  let currentRatio = '16-9';
  let visibleEntries = [...ENTRIES];
  let customEntries = []; /* 用户新增的卡片 */

  function getAllEntries() {
    return [...customEntries, ...visibleEntries];
  }

  function renderCards() {
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = '';
    getAllEntries().forEach(entry => {
      const isCustom = customEntries.some(e => e.period === entry.period && e._custom);
      const wrapper = document.createElement('div');
      wrapper.className = 'card-wrapper';
      wrapper.dataset.period = entry.period;
      wrapper.innerHTML = `
        <div class="card-meta">
          <span class="card-meta-period">
            NO.${entry.period} &nbsp;·&nbsp; ${(THEME_LABELS[entry.theme]||'').split('·')[0].trim()} &nbsp;·&nbsp; ${entry.author}
          </span>
          <div class="ratio-toggle">
            <button class="ratio-btn ${currentRatio==='16-9'?'active':''}" onclick="switchRatio(this,'${entry.period}','16-9')">16:9</button>
            <button class="ratio-btn ${currentRatio==='4-3'?'active':''}" onclick="switchRatio(this,'${entry.period}','4-3')">4:3</button>
          </div>
          <button class="save-btn" onclick="saveCard(event,'${entry.period}')">Export</button>
          ${isCustom ? `<button class="del-btn" onclick="deleteCustomCard('${entry.period}')">✕</button>` : ''}
        </div>
        <div id="card-container-${entry.period}">
          ${createCard(entry, currentRatio)}
        </div>`;
      grid.appendChild(wrapper);
    });
    const total = ENTRIES.length + customEntries.length;
    const shown = getAllEntries().length;
    document.getElementById('statsText').textContent = shown + ' / ' + total;
    document.getElementById('headerCount').textContent = '— ' + total + ' ISSUES —';
  }

  function switchRatio(btn, period, ratio) {
    const allEntries = [...customEntries, ...ENTRIES];
    const entry = allEntries.find(e => e.period === period);
    if (!entry) return;
    document.getElementById('card-container-' + period).innerHTML = createCard(entry, ratio);
    btn.closest('.ratio-toggle').querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setGlobalRatio() {
    currentRatio = document.getElementById('globalRatio').value;
    renderCards();
  }

  function filterCards() {
    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
    const theme = document.getElementById('themeFilter').value;
    visibleEntries = ENTRIES.filter(e => {
      const matchTheme = !theme || e.theme === theme;
      const matchKw = !kw || e.period.includes(kw) || e.author.includes(kw) || e.title.includes(kw);
      return matchTheme && matchKw;
    });
    renderCards();
  }

  /* ═══════════════════════════════════════════
     新增卡片
  ═══════════════════════════════════════════ */
  function toggleAddPanel() {
    const panel = document.getElementById('addPanel');
    panel.classList.toggle('open');
  }

  function addNewCard() {
    const period = document.getElementById('newPeriod').value.trim();
    const title  = document.getElementById('newTitle').value.trim();
    const author = document.getElementById('newAuthor').value.trim();
    const theme  = document.getElementById('newTheme').value;
    const ratio  = document.getElementById('newRatio').value;

    if (!period || !title || !author) {
      alert('请填写期数、标题和作者！');
      return;
    }
    /* 检查期数是否重复 */
    const allExist = [...ENTRIES, ...customEntries];
    if (allExist.find(e => e.period === period)) {
      if (!confirm('期数 ' + period + ' 已存在，是否仍然添加？')) return;
    }

    const newEntry = { period, title, author, theme, _custom: true };
    customEntries.unshift(newEntry);
    currentRatio = ratio;
    document.getElementById('globalRatio').value = ratio;

    /* 清空表单 */
    document.getElementById('newPeriod').value = '';
    document.getElementById('newTitle').value = '';
    document.getElementById('newAuthor').value = '';

    renderCards();

    /* 收起面板，滚动到顶部 */
    document.getElementById('addPanel').classList.remove('open');
    window.scrollTo({ top: document.querySelector('.main').offsetTop - 60, behavior: 'smooth' });
  }

  function deleteCustomCard(period) {
    customEntries = customEntries.filter(e => e.period !== period);
    renderCards();
  }

  /* ═══════════════════════════════════════════
     导出功能
  ═══════════════════════════════════════════ */
  async function saveCard(evt, period) {
    const container = document.getElementById('card-container-' + period);
    const card = container ? container.firstElementChild : null;
    if (!card) return;
    const btn = evt.currentTarget;
    const orig = btn.textContent;
    btn.textContent = '…';
    btn.disabled = true;
    try {
      const allEntries = [...customEntries, ...ENTRIES];
      const entry = allEntries.find(e => e.period === period);
      const canvas = await html2canvas(card, {
        scale: 3, useCORS: true, allowTaint: true,
        backgroundColor: null, logging: false
      });
      const a = document.createElement('a');
      a.download = '自然资源视界_第' + period + '期_' + (entry ? entry.author : '') + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    } catch(e) { alert('导出失败：' + e.message); }
    btn.textContent = orig;
    btn.disabled = false;
  }

  async function downloadAll() {
    const bar  = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('progressText');
    bar.style.display = 'block';
    const wrappers = document.querySelectorAll('.card-wrapper');
    const total = wrappers.length;
    const allEntries = [...customEntries, ...ENTRIES];
    for (let i = 0; i < total; i++) {
      const period = wrappers[i].dataset.period;
      const entry  = allEntries.find(e => e.period === period);
      const card   = wrappers[i].querySelector('[id^="card-"]');
      if (!card) continue;
      text.textContent = 'Exporting ' + (i+1) + ' / ' + total + '  ·  No.' + period;
      fill.style.width = ((i+1)/total*100) + '%';
      try {
        const canvas = await html2canvas(card, {
          scale: 3, useCORS: true, allowTaint: true,
          backgroundColor: null, logging: false
        });
        const a = document.createElement('a');
        a.download = '自然资源视界_第' + period + '期_' + (entry ? entry.author : '') + '.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        await new Promise(r => setTimeout(r, 500));
      } catch(e) { console.warn('skip', period, e); }
    }
    text.textContent = '✓ Done — ' + total + ' cards exported';
    setTimeout(() => { bar.style.display = 'none'; fill.style.width = '0%'; }, 3500);
  }

  /* 回车键快速生成 */
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('addPanel').classList.contains('open')) {
      addNewCard();
    }
  });

  window.onload = renderCards;
  </script>
  </body>
  </html>

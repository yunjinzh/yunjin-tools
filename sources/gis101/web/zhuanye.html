<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>职业教育专业目录（2021年）· 层级查询工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..600&family=Noto+Sans+SC:wght@200..700&family=Noto+Serif+SC:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F0EC; --paper-hi:#F7F6F2; --paper-lo:#E7E4DC; --paper-lo2:#DEDAD1;
  --ink:#16181B; --ink-2:#45484D; --ink-3:#84878D; --ink-4:#A9ABA9;
  --rule:#D5D1C8; --rule-2:#E4E1D9;
  --zz:#E07563; --zk:#3F6679; --bk:#A8822B;
  --zz-d:#A8432C; --zk-d:#2C4E5F; --bk-d:#7A5F14;
  --zz-t:rgba(224,117,99,.13); --zk-t:rgba(63,102,121,.12); --bk-t:rgba(168,130,43,.15);
  --sh1:0 1px 2px rgba(22,24,27,.05), 0 10px 26px -14px rgba(22,24,27,.22);
  --sh2:0 2px 8px rgba(22,24,27,.07), 0 30px 70px -24px rgba(22,24,27,.36);
  --f-lat:'Oswald','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  --f-sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-sans);
  font-weight:400; -webkit-font-smoothing:antialiased; line-height:1.6;
  letter-spacing:.005em;
}
body::before{
  content:'';position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.42;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='0.42'/%3E%3C/svg%3E");
}
::selection{background:var(--zz);color:#fff}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lat{font-family:var(--f-lat);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-lat);font-weight:500;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}

/* ---------- HEADER ---------- */
.hdr{position:sticky;top:0;z-index:200;background:linear-gradient(180deg,var(--paper-hi),var(--paper));
  border-bottom:1px solid var(--rule);backdrop-filter:saturate(1.2)}
.hdr-in{max-width:1560px;margin:0 auto;padding:20px 28px 0}
.hdr-top{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.brand .kicker{font-family:var(--f-lat);font-weight:500;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--zz-d);border:1px solid var(--zz);background:var(--zz-t);
  padding:3px 8px;border-radius:2px;white-space:nowrap}
h1{margin:0;font-family:var(--f-serif);font-weight:600;font-size:clamp(20px,2.4vw,31px);
  letter-spacing:-.01em;line-height:1.14}
.brand .sub{font-family:var(--f-lat);font-weight:300;font-size:12px;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase;white-space:nowrap}
.hdr-stats{display:flex;gap:26px;align-items:flex-end}
.hstat{text-align:right}
.hstat b{display:block;font-family:var(--f-lat);font-weight:300;font-size:30px;line-height:1;
  letter-spacing:-.02em}
.hstat span{font-family:var(--f-lat);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.hstat.zz b{color:var(--zz-d)}.hstat.zk b{color:var(--zk-d)}.hstat.bk b{color:var(--bk-d)}

.searchwrap{padding:20px 0 18px}
.searchbox{display:flex;align-items:center;gap:0;border:1.5px solid var(--ink);
  background:var(--paper-hi);border-radius:3px;box-shadow:var(--sh1);overflow:hidden}
.searchbox:focus-within{box-shadow:var(--sh2),0 0 0 3px var(--zz-t);border-color:var(--zz-d)}
.searchbox .icon{padding:0 4px 0 16px;display:flex;align-items:center}
.searchbox .icon svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:1.7}
.searchbox input{flex:1;border:0;outline:0;background:transparent;padding:15px 14px;font-size:16.5px;
  font-weight:400;letter-spacing:.01em}
.searchbox input::placeholder{color:var(--ink-4);font-weight:300}
.searchbox .hint{font-family:var(--f-mono);font-size:11px;color:var(--ink-4);padding:0 10px;
  border-left:1px solid var(--rule-2);white-space:nowrap}
.searchbox .clr{font-family:var(--f-lat);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding:0 16px;border-left:1px solid var(--rule-2);align-self:stretch;
  display:flex;align-items:center}
.searchbox .clr:hover{color:var(--zz-d)}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0 0}
.quick .q{font-size:12px;padding:4px 10px;border:1px solid var(--rule);border-radius:20px;
  background:var(--paper-hi);color:var(--ink-2);transition:.15s}
.quick .q:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}

/* ---------- SHELL ---------- */
.shell{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:304px minmax(0,1fr);
  align-items:start}
.side{position:sticky;top:var(--hdh,0px);align-self:start;height:calc(100vh - var(--hdh,0px));
  overflow-y:auto;border-right:1px solid var(--rule);padding:22px 0 60px;background:var(--paper-lo)}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px}
.side-sec{padding:0 18px 20px}
.side-sec + .side-sec{border-top:1px solid var(--rule-2);padding-top:18px}
.side-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side-hd .lbl{color:var(--ink-2)}
.lvrow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:3px;
  transition:.14s;border:1px solid transparent}
.lvrow:hover{background:var(--paper-hi);border-color:var(--rule)}
.lvrow[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.lvrow[aria-pressed="true"] .lvname,.lvrow[aria-pressed="true"] .lvcnt{color:var(--paper)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.zz{background:var(--zz)}.dot.zk{background:var(--zk)}.dot.bk{background:var(--bk)}
.dot.all{background:linear-gradient(135deg,var(--zz) 0 33%,var(--zk) 33% 66%,var(--bk) 66%)}
.lvname{flex:1;font-size:13.5px;font-weight:500}
.lvcnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.catrow{display:grid;grid-template-columns:20px minmax(0,1fr) 50px;gap:7px;align-items:center;width:100%;
  padding:6.5px 8px;border-radius:3px;border:1px solid transparent;transition:.13s}
.catrow:hover{background:var(--paper-hi);border-color:var(--rule)}
.catrow[aria-current="true"]{background:var(--paper-hi);border-color:var(--ink);
  box-shadow:2px 0 0 var(--zz) inset}
.catrow .cno{font-family:var(--f-lat);font-weight:400;font-size:11px;color:var(--ink-4)}
.catrow .cname{font-size:12.5px;line-height:1.32;font-weight:500;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.catrow[aria-current="true"] .cname{font-weight:700}
.mini{display:flex;gap:2px;align-items:center;justify-content:flex-end}
.mini i{display:block;height:5px;border-radius:1px;opacity:.85}
.mini i.zz{background:var(--zz)}.mini i.zk{background:var(--zk)}.mini i.bk{background:var(--bk)}
.side-note{font-size:11px;color:var(--ink-3);line-height:1.65;padding:0 18px}
.side-note b{color:var(--ink-2);font-weight:600}

/* ---------- MAIN ---------- */
.main{min-width:0;padding:20px 28px 90px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;
  border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:20px}
.bar-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bar-l .big{font-family:var(--f-lat);font-weight:300;font-size:34px;line-height:1;letter-spacing:-.02em}
.bar-l .cap{font-size:12.5px;color:var(--ink-3)}
.bar-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper-hi)}
.seg button{font-family:var(--f-lat);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 13px;color:var(--ink-3);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:hover:not([aria-pressed="true"]){background:var(--paper-lo);color:var(--ink)}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-lat);font-size:10px;
  font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:2.5px 7px;border-radius:2px;
  border:1px solid;white-space:nowrap}
.bdg.zz{color:var(--zz-d);border-color:var(--zz);background:var(--zz-t)}
.bdg.zk{color:var(--zk-d);border-color:var(--zk);background:var(--zk-t)}
.bdg.bk{color:var(--bk-d);border-color:var(--bk);background:var(--bk-t)}

/* result cards */
.rlist{display:grid;gap:0;border-top:1px solid var(--rule-2)}
.rcard{border-bottom:1px solid var(--rule-2);padding:15px 14px 15px 16px;cursor:pointer;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
  transition:.13s;position:relative;background:transparent}
.rcard:hover{background:var(--paper-hi);box-shadow:var(--sh1)}
.rcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.rcard.multi::before{background:linear-gradient(180deg,var(--zz),var(--zk) 50%,var(--bk))}
.rcard.s-zz::before{background:var(--zz)}
.rcard.s-zk::before{background:var(--zk)}
.rcard.s-bk::before{background:var(--bk)}
.rname{font-family:var(--f-serif);font-weight:600;font-size:19px;line-height:1.25;
  letter-spacing:-.005em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rtag{font-family:var(--f-lat);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;background:var(--ink);padding:2px 6px;border-radius:2px}
.rmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--ink-3)}
.rmeta .path{display:flex;align-items:center;gap:6px}
.rmeta .path b{color:var(--ink-2);font-weight:500}
.rbdg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.hl{background:rgba(224,117,99,.22);border-radius:2px;padding:0 1px;font-weight:600}
.more{display:block;width:100%;text-align:center;padding:13px;border:1px dashed var(--rule);
  border-radius:3px;margin:18px 0 0;font-family:var(--f-lat);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);background:var(--paper-hi)}
.more:hover{border-color:var(--ink);background:var(--paper-lo)}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
.empty .em{font-family:var(--f-serif);font-size:20px;color:var(--ink);margin-bottom:8px}

/* overview / stats */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px;margin-bottom:30px}
.ovcard{border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:3px;
  background:var(--paper-hi);padding:18px 18px 16px;box-shadow:var(--sh1);cursor:pointer;transition:.16s}
.ovcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.ovcard.zz{border-top-color:var(--zz)}.ovcard.zk{border-top-color:var(--zk)}.ovcard.bk{border-top-color:var(--bk)}
.ovcard .n{font-family:var(--f-lat);font-weight:200;font-size:52px;line-height:.94;letter-spacing:-.03em}
.ovcard.zz .n{color:var(--zz-d)}.ovcard.zk .n{color:var(--zk-d)}.ovcard.bk .n{color:var(--bk-d)}
.ovcard .t{font-family:var(--f-serif);font-size:15px;font-weight:600;margin-top:8px}
.ovcard .d{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.55}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin:34px 0 16px}
.sec-hd h2{margin:0;font-family:var(--f-serif);font-size:17px;font-weight:600;letter-spacing:.01em}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1px;
  background:var(--rule-2);border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.catcell{background:var(--paper);padding:13px 15px;transition:.14s;cursor:pointer;position:relative}
.catcell:hover{background:var(--paper-hi);z-index:2;box-shadow:var(--sh1)}
.catcell .cn{display:flex;align-items:baseline;gap:8px}
.catcell .cn i{font-family:var(--f-lat);font-style:normal;font-weight:400;font-size:11px;color:var(--ink-4)}
.catcell .cn b{font-family:var(--f-serif);font-size:14.5px;font-weight:600}
.catcell .m{display:flex;gap:14px;margin-top:9px}
.catcell .m div{display:flex;align-items:center;gap:5px}
.catcell .m em{font-family:var(--f-mono);font-style:normal;font-size:11.5px;color:var(--ink-2)}
.bars{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:9px;gap:2px}
.bars i{display:block;border-radius:1px;opacity:.9}
.bars i.zz{background:var(--zz)}.bars i.zk{background:var(--zk)}.bars i.bk{background:var(--bk)}

/* ===== compare view ===== */
.cmp-tabs{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;
  margin-bottom:18px;flex-wrap:wrap;background:var(--paper-hi)}
.cmp-tabs button{padding:7px 11px;border-right:1px solid var(--rule-2);font-size:11.5px;
  color:var(--ink-2);transition:.12s}
.cmp-tabs button:last-child{border-right:0}
.cmp-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cmp-tabs button:hover:not([aria-pressed="true"]){background:var(--paper-lo)}
.cmp-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;
  background:var(--rule-2);border:1px solid var(--rule-2);border-bottom:0;border-radius:3px 3px 0 0;
  overflow:hidden}
.cmp-hcell{background:var(--paper-lo);padding:11px 14px}
.cmp-hcell .hl1{display:flex;align-items:center;gap:8px}
.cmp-hcell .hl1 b{font-family:var(--f-serif);font-size:14px}
.cmp-hcell .hl1 em{font-family:var(--f-mono);font-style:normal;font-size:11px;color:var(--ink-3)}
.cmp-hcell .hl2{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.cmp-body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule-2);
  border:1px solid var(--rule-2);border-radius:0 0 3px 3px;overflow:hidden}
.cmp-cell{background:var(--paper);padding:12px 12px 16px;min-height:60px;align-self:stretch}
.cmp-sub{display:flex;align-items:baseline;gap:7px;border-bottom:1px solid var(--rule);
  padding-bottom:6px;margin-bottom:9px}
.cmp-sub em{font-family:var(--f-mono);font-style:normal;font-size:10.5px;color:var(--ink-4)}
.cmp-sub b{font-size:12.5px;font-weight:600}
.cmp-items{display:grid;gap:1px}
.cmp-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:baseline;
  padding:4.5px 6px;border-radius:2px;transition:.1s;cursor:pointer}
.cmp-item:hover,.cmp-item.on{background:var(--paper-lo);box-shadow:inset 0 0 0 1px var(--rule)}
.cmp-item .c{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:-.01em}
.cmp-item .nm{font-size:12.5px;line-height:1.35}
.cmp-item.on .nm{font-weight:600}
.cmp-empty{font-size:11.5px;color:var(--ink-4);font-style:italic;padding:2px 0}

/* ---------- DRAWER ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,24,27,.34);opacity:0;pointer-events:none;
  transition:.22s;z-index:600;backdrop-filter:blur(1.5px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(508px,94vw);background:var(--paper-hi);
  border-left:1px solid var(--ink);box-shadow:var(--sh2);transform:translateX(101%);
  transition:transform .28s cubic-bezier(.22,.7,.2,1);z-index:700;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhd{padding:18px 22px 14px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;
  gap:14px;align-items:flex-start}
.dhd .x{font-family:var(--f-lat);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--rule);padding:5px 9px;border-radius:2px}
.dhd .x:hover{color:var(--zz-d);border-color:var(--zz)}
.dbody{overflow-y:auto;padding:20px 22px 40px;flex:1}
.dbody::-webkit-scrollbar{width:9px}.dbody::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px}
.dtitle{font-family:var(--f-serif);font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.dsub{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.dsec{margin-top:26px}
.dsec > .lbl{display:block;margin-bottom:9px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.codebreak{display:flex;gap:1px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;
  background:var(--rule-2)}
.codebreak .seg2{flex:none;background:var(--paper);padding:10px 12px;text-align:center}
.codebreak .seg2:nth-child(1){flex:1}
.codebreak .seg2 b{display:block;font-family:var(--f-mono);font-size:22px;letter-spacing:.06em}
.codebreak .seg2 span{display:block;font-family:var(--f-lat);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.codebreak .seg2 .sub2{font-size:10.5px;color:var(--ink-2);margin-top:2px}
.kv{display:grid;grid-template-columns:74px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:1px}
.kv dd{margin:0;font-weight:500}
.chain{display:grid;gap:8px}
.chainrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;
  border:1px solid var(--rule);border-radius:3px;padding:9px 12px;background:var(--paper);
  transition:.13s;cursor:pointer}
.chainrow:hover{border-color:var(--ink);box-shadow:var(--sh1)}
.chainrow.cur{border-color:var(--ink);border-width:1.5px;background:var(--paper-hi)}
.chainrow .nm{font-size:13.5px;font-weight:500}
.chainrow .cd{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.siblist{display:flex;flex-wrap:wrap;gap:5px}
.sibchip{font-size:12px;border:1px solid var(--rule);border-radius:20px;padding:3px 10px;
  background:var(--paper);color:var(--ink-2);transition:.12s}
.sibchip:hover{border-color:var(--ink);color:var(--ink);background:var(--paper-lo)}
.sibchip.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dfoot{border-top:1px solid var(--rule);padding:12px 22px;font-size:11px;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dfoot button{font-family:var(--f-lat);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--rule);padding:5px 10px;border-radius:2px;color:var(--ink-2)}
.dfoot button:hover{border-color:var(--ink);color:var(--ink)}
.histnote{font-size:11.5px;color:var(--ink-3);line-height:1.7;border-left:2px solid var(--rule);
  padding-left:11px}

@media(max-width:1080px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .cmp-head,.cmp-body{grid-template-columns:1fr}
  .cmp-hcell{border-bottom:1px solid var(--rule-2)}
}
@media(max-width:620px){

      background:'#16181B',color:'#F1F0EC',padding:'9px 18px',borderRadius:'3px',fontSize:'12.5px',
      zIndex:9999,opacity:'0',transition:'.2s',letterSpacing:'.02em',boxShadow:'0 20px 50px -20px #000'});
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = '0', 1600);
}

/* =========================================================================
   检索
   ========================================================================= */
function tokens(q) { return q.trim().toLowerCase().split(/\s+/).filter(Boolean); }

function scoreMajor(e, toks) {
  const name = e.name.toLowerCase(), code = e.code.toLowerCase();
  let s = 99;
  for (const t of toks) {
    let v = 99;
    if (name === t) v = 0;
    else if (name.startsWith(t)) v = 1;
    else if (name.includes(t)) v = 2;
    else if (code === t) v = 3;
    else if (code.startsWith(t)) v = 4;
    else if (code.includes(t)) v = 5;
    else if (e.subName.includes(t) || e.catName.includes(t)) v = 6;
    if (v === 99) return 99;
    s = Math.min(s, v) + (v >= 6 ? 100 : 0);
  }
  return s;
}

function buildGroups() {
  const toks = tokens(state.q);
  let list = ALL.filter(e => state.level === 'all' || e.level === state.level);
  if (state.catNo !== null) list = list.filter(e => e.catNo === state.catNo);

  if (toks.length) {
    const scored = [];
    for (const e of list) { const s = scoreMajor(e, toks); if (s < 99) scored.push([s, e]); }
    if (!scored.length) return { groups: [], toks, hitCats: [] };
    // 分组：同名归并
    const map = new Map();
    scored.forEach(([s, e]) => {
      if (!map.has(e.name)) map.set(e.name, { name: e.name, items: [], score: 99 });
      const g = map.get(e.name); g.items.push(e); g.score = Math.min(g.score, s);
    });
    let groups = [...map.values()];
    groups.forEach(g => g.items.sort((a, b) => lvIdx(a.level) - lvIdx(b.level)));
    groups.sort((a, b) => a.score - b.score
      || b.items.length - a.items.length
      || a.items[0].code.localeCompare(b.items[0].code));
    return { groups, toks, hitCats: [] };
  }

  // 无检索：全部按大类分组呈现
  const map = new Map();
  list.forEach(e => {
    const k = e.catNo + '|' + e.name;
    if (!map.has(k)) map.set(k, { name: e.name, items: [], score: 0, catNo: e.catNo });
    map.get(k).items.push(e);
  });
  let groups = [...map.values()];
  sortGroups(groups);
  return { groups, toks: [], hitCats: [] };
}

function sortGroups(groups) {
  const s = state.sort;
  groups.forEach(g => g.items.sort((a, b) => lvIdx(a.level) - lvIdx(b.level) || a.code.localeCompare(b.code)));
  if (s === 'code') groups.sort((a, b) => a.items[0].code.localeCompare(b.items[0].code));
  else if (s === 'name') groups.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN'));
  else groups.sort((a, b) =>
    (a.catNo ?? a.items[0].catNo) - (b.catNo ?? b.items[0].catNo)
    || a.items[0].code.localeCompare(b.items[0].code));
}
const lvIdx = k => ['zz', 'zk', 'bk'].indexOf(k);

/* =========================================================================
   渲染
   ========================================================================= */
function render() {
  const stage = $('#stage');
  const toks = tokens(state.q);
  const inCmp = state.view === 'cmp';
  stage.innerHTML = '';

  if (inCmp) {
    renderCmp(stage);
    return;
  }
  const { groups } = buildGroups();
  $('#cntBig').textContent = groups.reduce((a, g) => a + g.items.length, 0);
  $('#cntCap').textContent = toks.length
    ? `条匹配记录 · ${groups.length} 个专业名称`
    : `条专业记录 · ${groups.length} 个专业名称`;

  if (!toks.length && state.catNo === null && state.level === 'all' && !state.limitExpanded) {
    renderOverview(stage);
    $('#cntBig').textContent = DB.meta.total;
    $('#cntCap').textContent = `条专业记录 · ${groups.length} 个专业名称 · 三层次合计`;
    return;
  }

  if (!groups.length) {
    stage.appendChild(el('div', 'empty', `<div class="em">未找到匹配的专业</div>
      <div>可尝试更短的关键词、专业代码前几位，或切换层级筛选</div>`));
    return;
  }

  const list = el('div', 'rlist');
  const shown = groups.slice(0, state.limit);
  shown.forEach(g => list.appendChild(card(g, toks)));
  stage.appendChild(list);

  if (groups.length > state.limit) {
    const b = el('button', 'more', `还有 ${groups.length - state.limit} 组 · 点击展开全部（共 ${groups.length} 组）`);
    b.onclick = () => { state.limit = groups.length; render(); };
    stage.appendChild(b);
    stage.appendChild(el('div', '', `<div class="histnote" style="margin-top:14px">
      结果较多时建议补充关键词或限定层级，以缩小范围。</div>`));
  }
}

function card(g, toks) {
  const levels = [...new Set(g.items.map(i => i.level))];
  const multi = levels.length > 1;
  const lead = g.items[0];
  const cls = 'rcard ' + (multi ? 'multi' : 's-' + lead.level);
  const node = el('div', cls);

  const badges = g.items.map(i => {
    const L = LV[i.level];
    return `<span class="bdg ${i.level}">${L.tag} ${esc(i.code)}</span>`;
  }).join('');

  const multiTag = multi ? `<span class="rtag">跨层级 ${levels.length}</span>` : '';

  node.innerHTML = `
    <div>
      <div class="rname">${mark(g.name, toks)}${multiTag}</div>
      <div class="rmeta">
        <span class="path"><b>${esc(lead.catName)}</b> › <b>${esc(lead.subName)}</b></span>
        <span>层级：${levels.map(k => LV[k].tag).join(' / ')}</span>
        <span>代码：${g.items.map(i => esc(i.code)).join(' · ')}</span>
      </div>
    </div>
    <div class="rbdg">${badges}</div>`;
  node.onclick = () => openDrawer(lead, g);
  return node;
}

/* ---------- 概览 ---------- */
function renderOverview(stage) {
  const ov = el('div', 'ov-grid');
  DB.levels.forEach(L => {
    const n = DB.cats.reduce((a, c) => a + c.levels[L.key].count, 0);
    const c = el('div', 'ovcard ' + L.key, `
      <div class="n">${n}</div>
      <div class="t">${esc(L.full)}</div>
      <div class="d">${esc(L.note)}</div>`);
    c.onclick = () => { state.level = L.key; state.limit = 120; renderLv(); render(); };
    ov.appendChild(c);
  });
  stage.appendChild(ov);

  const hd = el('div', 'sec-hd', `<h2>19 个专业大类 · 三层次分布</h2>
    <span class="lbl">点击大类进入三层对照</span>`);
  stage.appendChild(hd);

  const grid = el('div', 'catgrid');
  const maxN = Math.max(...DB.cats.map(c => DB.levels.reduce((a, L) => a + c.levels[L.key].count, 0)));
  DB.cats.forEach(c => {
    const nums = DB.levels.map(L => c.levels[L.key].count);
    const tot = nums.reduce((a, b) => a + b, 0);
    const cell = el('div', 'catcell', `
      <div class="cn"><i>${String(c.no).padStart(2, '0')}</i><b>${esc(c.name)}</b></div>
      <div class="m">${DB.levels.map((L, i) =>
        `<div><span class="dot ${L.key}"></span><em>${nums[i]}</em></div>`).join('')}</div>
      <div class="bars">${DB.levels.map((L, i) =>
        `<i class="${L.key}" style="width:${(nums[i] / maxN * 100).toFixed(1)}%"></i>`).join('')}</div>`);
    cell.onclick = () => {
      state.catNo = c.no; state.view = 'cmp'; state.limit = 400;
      renderCat(); renderSegs(); render();
    };
    grid.appendChild(cell);
  });
  stage.appendChild(grid);

  stage.appendChild(el('div', '', `<div class="histnote" style="margin-top:22px">
    <b>怎么用：</b>① 直接检索专业名称或代码，卡片上的 <span class="bdg zz">中职</span>
    <span class="bdg zk">专科</span> <span class="bdg bk">本科</span> 徽章即为该专业所属层次；
    ② 点击卡片查看详情、编码构成与跨层次对应专业；
    ③ 点击左侧大类或「三层对照」，可横向比较同一大类在中职 / 专科 / 本科三个层次的类目与专业设置。</div>`));
}

/* =========================================================================
   三层对照
   ========================================================================= */
function renderCmp(stage) {
  const tabs = el('div', 'cmp-tabs');
  DB.cats.forEach(c => {
    const b = el('button', '', `${String(c.no).padStart(2, '0')} ${esc(c.name)}`);
    b.setAttribute('aria-pressed', state.catNo === c.no);
    b.onclick = () => { state.catNo = c.no; renderCat(); renderCmp(stage); };
    tabs.appendChild(b);
  });
  stage.appendChild(tabs);

  const cat = DB.cats.find(c => c.no === state.catNo);
  if (!cat) return;
  const total = DB.levels.reduce((a, L) => a + cat.levels[L.key].count, 0);
  $('#cntBig').textContent = total;
  $('#cntCap').textContent = `条专业记录 · ${esc(cat.name)}（三层次合计）`;

  const head = el('div', 'cmp-head');
  DB.levels.forEach(L => {
    const node = cat.levels[L.key];
    head.appendChild(el('div', 'cmp-hcell', `
      <div class="hl1"><span class="dot ${L.key}"></span><b>${L.tag}专业</b><em>${node.code}</em></div>
      <div class="hl2">${esc(L.full)} · ${node.subs.length} 个类 · ${node.count} 个专业</div>`));
  });
  stage.appendChild(head);

  const tails = [...new Set(DB.levels.flatMap(L => cat.levels[L.key].subs.map(s => s.tail)))].sort();
  const body = el('div', 'cmp-body');
  tails.forEach(tail => {
    DB.levels.forEach(L => {
      const s = cat.levels[L.key].subs.find(x => x.tail === tail);
      const cell = el('div', 'cmp-cell');
      if (!s) { cell.appendChild(el('div', 'cmp-empty', '本层次未设置该类')); }
      else {
        cell.appendChild(el('div', 'cmp-sub', `<em>${s.code}</em><b>${esc(s.name)}</b>`));
        const wrap = el('div', 'cmp-items');
        s.items.forEach(([code, name]) => {
          const it = el('div', 'cmp-item', `<span class="c">${code}</span><span class="nm">${esc(name)}</span>`);
          it.dataset.seq = code.slice(4);
          it.onclick = () => openDrawer(ALL.find(e => e.code === code && e.level === L.key));
          it.onmouseenter = () => paintSeq(code.slice(4), true);
          it.onmouseleave = () => paintSeq(code.slice(4), false);
          wrap.appendChild(it);
        });
        cell.appendChild(wrap);
      }
      body.appendChild(cell);
    });
  });
  stage.appendChild(body);
  stage.appendChild(el('div', '', `<div class="histnote" style="margin-top:20px">
    同一「类」内左右同行的专业，其代码末两位（专业序号）相同，可视为该专业在不同层次上的对应设置（如中职 610101 种子生产技术 ↔ 专科 410101 种子生产与经营 ↔ 本科 210101 现代种业技术）。此对照按序号对齐，供参考，不代表官方认定的贯通关系。</div>`));
}

function paintSeq(seq, on) {
  document.querySelectorAll('.cmp-item[data-seq="' + seq + '"]').forEach(n => n.classList.toggle('on', on));
}

/* =========================================================================
   详情抽屉
   ========================================================================= */
function openDrawer(e, group) {
  if (!e) return;
  state.sel = e;
  const L = LV[e.level];
  $('#dTitle').textContent = e.name;
  $('#dSub').innerHTML = `<span class="bdg ${e.level}">${L.tag}专业</span>
    <span class="mono" style="font-size:13px;color:var(--ink-3)">${esc(e.code)}</span>`;

  const siblings = group ? group.items : BYNAME.get(e.name) || [e];
  const sameName = (BYNAME.get(e.name) || []).slice().sort((a, b) => lvIdx(a.level) - lvIdx(b.level));
  const inSub = ALL.filter(x => x.level === e.level && x.subCode === e.subCode && x.code !== e.code);

  const codeSeg = [
    {v: e.code.slice(0, 2), l: '大类', d: e.catName},
    {v: e.code.slice(2, 4), l: '类', d: e.subName.replace(/类$/, '')},
    {v: e.code.slice(4, 6), l: '序号', d: '第 ' + parseInt(e.code.slice(4), 10) + ' 位'},
  ];

  $('#dBody').innerHTML = `
    <div class="dsec" style="margin-top:0">
      <span class="lbl">专业代码构成</span>
      <div class="codebreak">
        ${codeSeg.map((s, i) => `<div class="seg2">
          <b>${s.v}</b><span>${s.l}</span><div class="sub2">${esc(s.d)}</div></div>`).join('')}
      </div>
    </div>

    <div class="dsec">
      <span class="lbl">所属分类</span>
      <dl class="kv">
        <dt>专业层次</dt><dd>${esc(L.full)}（${L.tag}）</dd>
        <dt>专业大类</dt><dd>${esc(e.catName)} · <span class="mono" style="color:var(--ink-3)">${e.code.slice(0,2)}</span></dd>
        <dt>专业类</dt><dd>${esc(e.subName)} · <span class="mono" style="color:var(--ink-3)">${e.subCode}</span></dd>
        <dt>层次说明</dt><dd style="font-weight:400;font-size:12.5px;color:var(--ink-2)">${esc(L.note)}</dd>
      </dl>
    </div>

    <div class="dsec">
      <span class="lbl">该名称在各层次的设置（${sameName.length}）</span>
      <div class="chain">
        ${['zz', 'zk', 'bk'].map(k => {
          const hit = sameName.find(x => x.level === k);
          const lv = LV[k];
          if (!hit) return `<div class="chainrow" style="opacity:.5;cursor:default">
            <span class="dot ${k}"></span><span class="nm">${lv.tag}层次未设置同名专业</span>
            <span class="cd">—</span></div>`;
          return `<div class="chainrow ${hit === e ? 'cur' : ''}" data-code="${hit.code}" data-lv="${k}">
            <span class="dot ${k}"></span>
            <span class="nm">${esc(hit.name)}<br><span class="cd">${esc(hit.catName)} › ${esc(hit.subName)}</span></span>
            <span class="cd">${esc(hit.code)}</span></div>`;
        }).join('')}
      </div>
    </div>

    <div class="dsec">
      <span class="lbl">同层次同一「类」下的其他专业（${inSub.length}）</span>
      <div class="siblist">
        ${inSub.map(x => `<button class="sibchip" data-code="${x.code}" data-lv="${x.level}">${esc(x.name)}</button>`).join('') || '<span style="font-size:12px;color:var(--ink-3)">无</span>'}
      </div>
    </div>`;

  $('#dBody').querySelectorAll('[data-code]').forEach(n => {
    n.onclick = () => {
      const t = ALL.find(x => x.code === n.dataset.code && x.level === n.dataset.lv);
      if (t) openDrawer(t, null);
    };
  });
  $('#dCopy').onclick = () => {
    navigator.clipboard?.writeText(e.code).then(() => toast('已复制专业代码 ' + e.code),
      () => toast('复制失败，请手动选择'));
  };
  $('#dFoot').textContent = `${L.tag} · ${e.catName}`;
  $('#drawer').classList.add('on');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('on');
}
function closeDrawer() {
  $('#drawer').classList.remove('on');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('on');
}
$('#dClose').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;

/* =========================================================================
   事件
   ========================================================================= */
let tmr = null;
$('#q').addEventListener('input', ev => {
  clearTimeout(tmr);
  tmr = setTimeout(() => {
    state.q = ev.target.value; state.limit = 120;
    if (state.q.trim()) state.view = 'list';
    renderSegs(); render();
  }, 90);
});
$('#clr').onclick = () => { $('#q').value = ''; state.q = ''; state.catNo = null;
  state.level = 'all'; state.view = 'list'; state.limit = 120;
  renderLv(); renderCat(); renderSegs(); render(); $('#q').focus(); };
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#drawer').classList.contains('on')) closeDrawer(); }
  if (ev.key === '/' && document.activeElement !== $('#q')) { ev.preventDefault(); $('#q').focus(); }
});

/* 头部高度 -> 侧栏 sticky 偏移 */
function syncH() {
  const h = $('#hdr').offsetHeight;
  document.documentElement.style.setProperty('--hdh', h + 'px');
}
new ResizeObserver(syncH).observe($('#hdr'));
syncH();

renderLv();
renderCat();
renderSegs();
render();
</script>

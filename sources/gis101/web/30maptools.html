        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const modal = document.getElementById('modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalPanel = document.getElementById('modal-panel');
        const closeBtn = document.getElementById('close-btn');

        function updateAndRenderGallery() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const sortMethod = sortSelect.value;
            let filteredData = toolsData.filter(tool => tool.name.toLowerCase().includes(searchTerm) || tool.shortDesc.toLowerCase().includes(searchTerm) || tool.fullDesc.toLowerCase().includes(searchTerm));
            filteredData.sort((a, b) => {
                if (sortMethod === 'newest') return b.id - a.id;
                if (sortMethod === 'oldest') return a.id - b.id;
                if (sortMethod === 'name') return a.name.localeCompare(b.name, 'zh-CN');
                return 0;
            });

            if (filteredData.length === 0) {
                gallery.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                gallery.innerHTML = filteredData.map(tool => `
                    <div class="card-item bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 cursor-pointer group flex flex-col" onclick="openModal(${tool.id})">
                        <div class="w-full bg-gray-100 relative overflow-hidden border-b border-gray-100 shrink-0">
                            <img src="${tool.image}" alt="${tool.name}" class="w-full h-auto block group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-2 py-1 rounded text-xs font-medium text-gray-700 shadow-sm z-10">${tool.rights.split('/')[0].trim()}</div>
                        </div>
                        <div class="p-5 flex-grow flex flex-col">
                            <h3 class="text-lg font-bold text-gray-900 mb-1 group-hover:text-blue-600 transition-colors">${tool.name}</h3>
                            <p class="text-sm text-gray-500 line-clamp-2">${tool.shortDesc}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        searchInput.addEventListener('input', updateAndRenderGallery);
        sortSelect.addEventListener('change', updateAndRenderGallery);

        window.openModal = function(id) {
            const tool = toolsData.find(t => t.id === id);
            if (!tool) return;
            document.getElementById('modal-img').src = tool.image;
            document.getElementById('modal-title').textContent = tool.name;
            document.getElementById('modal-badge').textContent = tool.rights;
            document.getElementById('modal-desc').textContent = tool.fullDesc;
            const linkBtn = document.getElementById('modal-link');
            if (tool.url.startsWith('http')) {
                linkBtn.href = tool.url;
                linkBtn.innerHTML = `访问工具网站`;
            } else {
                linkBtn.href = '#';
                linkBtn.innerHTML = `请在手机应用商店搜索下载`;
            }
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modalBackdrop.classList.remove('opacity-0');
            modalBackdrop.classList.add('opacity-100');
            modalPanel.classList.remove('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
            modalPanel.classList.add('opacity-100', 'translate-y-0', 'sm:scale-100');
            document.body.style.overflow = 'hidden'; 
        };

        function closeModal() {
            modalBackdrop.classList.remove('opacity-100');
            modalBackdrop.classList.add('opacity-0');
            modalPanel.classList.remove('opacity-100', 'translate-y-0', 'sm:scale-100');
            modalPanel.classList.add('opacity-0', 'translate-y-4', 'sm:translate-y-0', 'sm:scale-95');
            setTimeout(() => { modal.classList.add('hidden'); document.body.style.overflow = ''; }, 300);
        }

        closeBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal(); });

        updateAndRenderGallery();
    </script>

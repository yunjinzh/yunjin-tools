<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#171c1c"><title>京观 · 北京城市三维漫游</title><meta name="description" content="从天坛到国贸，在真实地理坐标上探索北京地标、建筑与山川。"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script></head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="京观，回到首页"><span class="seal" aria-hidden="true">京</span><strong>京观</strong></a><span class="brandline"></span><span class="edition">北京城市三维漫游<small>BEIJING SPATIAL ATLAS</small></span>
  <nav aria-label="主导航"><button class="nav-item active" id="navScene"><i data-i="orbit"></i>三维漫游</button><button class="nav-item" data-panel="map"><i data-i="map"></i>城市地图</button></nav>
  <div class="topright"><button class="top-icon" id="full" aria-label="全屏" title="全屏"><i data-i="full"></i></button><button class="top-icon" data-panel="help" aria-label="操作指南" title="操作指南"><i data-i="help"></i></button></div>
</header>
<main>
<section id="stage" aria-label="北京三维场景" tabindex="0">
 <div id="backdrop"></div><canvas id="world" aria-label="可拖动、缩放与漫游的三维场景"></canvas><div class="scrim"></div>
 <div class="location"><div class="kicker"><span></span><b id="region">东城区</b><em></em><span id="kind">古都建筑</span></div><h1 id="place">故宫 · 太和殿</h1><div id="enplace">HALL OF SUPREME HARMONY</div><div class="place-actions"><button id="detailButton" data-panel="detail"><i data-i="book"></i>地标档案</button><button id="fieldButton" hidden><i data-i="expand"></i>实景对照</button></div></div>
 <div class="environment"><button id="envButton" class="envbutton" data-panel="env" aria-haspopup="dialog"><i data-i="sun" id="weatherIcon"></i><span id="clock">16:20</span><span class="vsep"></span><span id="weatherTag">晴天</span><i data-i="sliders"></i></button></div>
 <button id="cinema" aria-pressed="false" title="收起导航，铺满三维场景"><i data-i="expand"></i><span>沉浸</span></button><div id="views" hidden aria-label="建筑观察视角"></div>
 <div class="maptools"><button id="compass" title="朝北俯瞰" aria-label="朝北俯瞰"><small>N</small><svg width="18" height="29" viewBox="0 0 18 29"><g id="needle"><path d="M9 1 16 22 9 18Z" fill="#dc8364"/><path d="M9 1 2 22 9 18Z" fill="#e5e2d7"/></g></svg></button><div class="toolstack"><button id="zoomIn" aria-label="靠近" title="靠近"><i data-i="plus"></i></button><button id="zoomOut" aria-label="后退" title="后退"><i data-i="minus"></i></button><button id="home" aria-label="回到地标视角" title="回到地标视角"><i data-i="focus"></i></button></div></div>
 <div id="touchpad" aria-label="移动控制"><button data-move="KeyW" aria-label="向前">▲</button><div><button data-move="KeyA" aria-label="向左">◀</button><button data-move="KeyS" aria-label="向后">▼</button><button data-move="KeyD" aria-label="向右">▶</button></div><div class="climb"><button data-move="KeyQ" aria-label="降低飞行高度">− 高</button><button data-move="KeyE" aria-label="增加飞行高度">+ 高</button></div></div>
 <div class="stage-bottom"><div class="modegroup" aria-label="移动方式"><button id="fly" class="on"><i data-i="plane"></i>飞行</button><button id="walk"><i data-i="walk"></i>漫游</button></div><div id="hint">拖动环视 <b>·</b> 滚轮缩放 <b>·</b> WASD 移动</div><button data-panel="map" class="minimap" title="打开城市地图"><canvas id="mini" width="190" height="110" aria-hidden="true"></canvas><span><i data-i="expand"></i>位置图</span></button></div>
 <div id="loading" role="status"><span></span><b id="loadingText">正在载入三维场景</b></div><div id="toast" role="status" aria-live="polite"></div>
</section>
<section class="shelf" aria-label="地标导航"><div class="shelf-head"><div class="shelf-title"><i data-i="landmark"></i><h2>地标导航</h2><small id="count">08</small></div><div class="filters" aria-label="地标类别"><button class="sel" data-cat="all">全部</button><button data-cat="古都建筑">古都建筑</button><button data-cat="当代地标">当代地标</button></div><div class="shelf-actions"><button class="tour" id="tour"><i data-i="play"></i><span>自动导览</span></button><div class="shelf-arrows"><button id="prev" aria-label="向前浏览地标"><i data-i="left"></i></button><button id="next" aria-label="向后浏览地标"><i data-i="right"></i></button></div></div></div><div id="cards" aria-label="选择地标"></div></section>
</main>
<footer><span class="readout"><i data-i="pin"></i><span id="coords">39.883° N　116.406° E</span><span class="bar"></span><span id="alt">视点离地 — m</span></span><button data-panel="sources">© OpenStreetMap contributors · EOX <span class="bar"></span> 数据来源 <i data-i="info"></i></button></footer>
<dialog id="dialog"><div class="modalhead"><div><span id="modalEn"></span><h2 id="modalTitle"></h2></div><button id="closeDialog" class="iconbtn" aria-label="关闭"><i data-i="x"></i></button></div><div id="modalBody"></div></dialog>
<dialog id="fieldDialog" aria-labelledby="fieldTitle"><div class="field-bar"><div><span class="field-kicker">FIELD PHOTOGRAPHY</span><h2 id="fieldTitle"></h2></div><button id="fieldClose">返回三维 <span aria-hidden="true">×</span></button></div><div class="field-main"><div id="fieldScreen" tabindex="0" aria-label="实景照片，可缩放及拖动"><img id="fieldImage" alt=""><canvas id="fieldSphere" hidden></canvas><div id="fieldMessage" role="status"></div></div><div class="field-tools"><button id="fieldMinus" aria-label="缩小实景">−</button><button id="fieldPlus" aria-label="放大实景">＋</button><button id="fieldReset" title="还原取景">还原</button></div></div><div class="field-info"><div><small id="fieldType"></small><h3 id="fieldName"></h3><p id="fieldDescription"></p><p id="fieldCredit"></p></div><div id="fieldStrip" aria-label="选择实景"></div></div></dialog>
<noscript>请开启 JavaScript 以加载三维场景和地标导航。</noscript><script src="icons.js"></script><script type="module" src="app.js"></script>
</body></html>

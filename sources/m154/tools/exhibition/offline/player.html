<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>京观 · 北京城市展映</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131b1b;color:#f2eee2;font:16px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
main{width:min(1280px,94vw);margin:clamp(18px,4vw,56px) auto}header,section,nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header{justify-content:space-between}
h1,h2{margin:0;font-family:"Songti SC",SimSun,serif;letter-spacing:.03em}h1{font-size:clamp(24px,3vw,42px)}h2{font-size:clamp(20px,2vw,30px)}
small{color:#b8c0b7}video{display:block;width:100%;max-height:68vh;aspect-ratio:16/9;background:#0b1111;margin:20px auto;border-radius:5px}
nav{gap:8px;margin:18px 0 19px}button{cursor:pointer;border:1px solid #51615a;border-radius:3px;padding:9px 15px;background:transparent;color:inherit;font:inherit}
button[aria-pressed=true]{background:#e3d4ad;border-color:#e3d4ad;color:#1c2422}button:focus-visible{outline:3px solid #ffc761;outline-offset:2px}
p{color:#cbd1c9;margin:.4rem 0}footer{color:#a6afa7;font-size:14px;border-top:1px solid #37433d;margin-top:24px;padding-top:13px}
</style>
<body><main>
<header><h1>京观 · 北京城市展映</h1><small>离线放映</small></header>
<video controls preload="metadata" playsinline aria-label="北京城市展映"></video>
<nav aria-label="选择展映章节"></nav>
<section><h2 id="title"></h2><small id="district"></small></section><p id="caption"></p>
<p id="message" role="status"></p>
<footer>探索交互式三维地图，请在解压后的文件夹中双击“启动三维漫游.cmd”。</footer></main>
<script>
const chapters=/*CHAPTER_DATA*/;
const player=document.querySelector('video'),navigation=document.querySelector('nav'),message=document.querySelector('#message');let current=0;
function showChapter(index,start){
  current=index;const scene=chapters[index];
  document.querySelector('#title').textContent=scene.name;
  document.querySelector('#district').textContent=scene.district;
  document.querySelector('#caption').textContent=scene.caption;
  message.textContent='';
  Array.from(navigation.children).forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
  player.src='dist/exhibit/'+scene.id+'.mp4';
  if(start)player.play().catch(()=>{if(!player.error)message.textContent='请使用画面内的播放按钮继续。';});
}
chapters.forEach((scene,index)=>{const button=document.createElement('button');button.textContent=scene.name;button.addEventListener('click',()=>showChapter(index,true));navigation.append(button);});
player.addEventListener('ended',()=>showChapter((current+1)%chapters.length,true));
player.addEventListener('error',()=>{message.textContent='此段影片未能打开。请完整解压后使用支持 H.264 的浏览器播放。';});
showChapter(0,false);
</script></body></html>

let graphPositions={};
function drawGraph(){let nodes=[],lines=[],svg=$('#graph');if(!svg)return;const center={x:500,y:355};function add(id,x,y,r,label=true){const n=nodeById(id);nodes.push({...n,x,y,r,label});graphPositions[id]={x,y}}
if(state.layout==='relations'){const n=nodeById(state.selected);add(n.id,500,350,n.type==='course'?60:35);const edges=DATA.edges.filter(e=>e.source===n.id||e.target===n.id);const neighbors=[...new Set(edges.map(e=>e.source===n.id?e.target:e.source))];neighbors.forEach((id,i)=>{const a=-Math.PI/2+i*2*Math.PI/neighbors.length;add(id,500+325*Math.cos(a),350+255*Math.sin(a),nodeById(id).type==='knowledge'?8:23);const edge=edges.find(e=>e.source===id||e.target===id);lines.push([n.id,id,edge.type])})}
else if(!state.module){add('COURSE',500,355,60);DATA.modules.forEach((m,i)=>{const angle=-Math.PI/2+i*Math.PI/4;const x=500+265*Math.cos(angle),y=355+258*Math.sin(angle);add(m.id,x,y,29);lines.push(['COURSE',m.id]);abilities(m.id).forEach((a,j)=>{const da=-Math.PI/2+(j-1.5)*.54;const ax=x+69*Math.cos(da),ay=y+69*Math.sin(da);add(a.id,ax,ay,6,false);lines.push([m.id,a.id])})})}
else{const mid=state.module;add(mid,145,350,44);abilities(mid).forEach((a,i)=>{let y=115+i*153;add(a.id,360,y,22);lines.push([mid,a.id]);if(state.filter!=='ability')DATA.nodes.filter(n=>n.type==='knowledge'&&n.ability===a.id).forEach((k,j)=>{add(k.id,700,y-52+j*35,5);lines.push([a.id,k.id])})});add('T'+mid.slice(1),145,635,20);lines.push([mid,'T'+mid.slice(1)])}
const selected=state.selected;const connected=new Set(DATA.edges.filter(e=>e.source===selected||e.target===selected).flatMap(e=>[e.source,e.target]));
const defs=`<defs><filter id="node-shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#45624b" flood-opacity=".12"/></filter></defs>`;
const edgeHTML=lines.map(([a,b,rel])=>{let p=graphPositions[a],q=graphPositions[b];return `<path class="graph-edge" d="M${p.x},${p.y} C${(p.x+q.x)/2},${p.y} ${(p.x+q.x)/2},${q.y} ${q.x},${q.y}" ${a===selected||b===selected?'style="stroke:#bd7f67;stroke-width:2;stroke-opacity:.85"':''}/>${rel?`<text x="${(p.x+q.x)/2}" y="${(p.y+q.y)/2-5}" text-anchor="middle" font-size="10" fill="#9b9e8f">${rel}</text>`:''}`}).join('');
const nodeHTML=nodes.map(n=>{const col=n.type==='course'?'#304e40':mod(n.module)?.color||'#557f70';const selected=n.id===state.selected;let label='';if(n.type==='course'){label=`<text fill="#f3f1e8" text-anchor="middle" y="-7" font-family="Georgia" font-size="29">CIM</text><text fill="#d6decd" text-anchor="middle" y="18" font-size="11" letter-spacing="2">技术应用</text><text fill="#7b8d76" text-anchor="middle" y="92" font-size="10" letter-spacing="2">连接知识与行动</text>`}else if(n.type==='module'){label=`<text text-anchor="middle" y="5" fill="#fffaf0" font-family="Georgia" font-size="18">${n.id.slice(1).padStart(2,'0')}</text><text text-anchor="middle" y="${n.r+25}" fill="#415c48" font-size="13" font-weight="500">${esc(n.title)}</text>${!state.module?`<text text-anchor="middle" y="${n.r+44}" fill="#91a08a" font-size="9">04 能力 / 16 知识</text>`:''}`}
else if(n.type==='ability'&&state.module){label=`<text text-anchor="middle" y="4" fill="#fffaf0" font-size="10">${n.id}</text><text text-anchor="middle" y="43" fill="#415c48" font-size="14">${esc(n.title)}</text>`}

else if(n.type==='task'){label=`<text y="4" fill="#fff7ef" font-size="11" text-anchor="middle">${n.id}</text><text text-anchor="middle" y="40" fill="#7b765e" font-size="10">进入贯穿任务 ↗</text>`}
else if(state.layout==='relations'){label=`<text text-anchor="middle" y="4" fill="#fffaf0" font-size="9">${n.id}</text><text text-anchor="middle" y="${n.r+22}" font-size="12" fill="#415c48">${esc(n.title.length>16?n.title.slice(0,16)+'…':n.title)}</text>`}
else{label=`<g class="hover-label"><rect x="-85" y="-39" width="170" height="26" fill="#f9f8f4" rx="5" stroke="#d2dccc"/><text text-anchor="middle" y="-21" font-size="11" fill="#334d3e">${esc(n.title)}</text></g>`}
return `<g class="graph-node" data-node="${n.id}" transform="translate(${n.x},${n.y})" tabindex="0" role="button" aria-label="${esc(types[n.type]+'：'+n.title)}">${selected?`<circle r="${n.r+7}" fill="none" stroke="${col}" stroke-opacity=".3" stroke-width="1"/>`:''}${n.type==='task'?`<rect class="node-shape" x="-${n.r}" y="-${n.r}" width="${n.r*2}" height="${n.r*2}" rx="6" fill="#bf8067"/>`:`<circle class="node-shape" r="${n.r}" fill="${n.type==='knowledge'?'#f5f6ed':col}" stroke="${n.type==='knowledge'?col:'none'}" ${n.r>20?'filter="url(#node-shadow)"':''}/>`}${+state.status[n.id]===2?`<circle cx="${n.r-1}" cy="-${n.r-1}" r="4" fill="#455f3c" stroke="#f9f8f4"/>`:''}${label}</g>`}).join('');
svg.innerHTML=defs+`<g id="viewport">${edgeHTML}${nodeHTML}</g>`;transformGraph();svg.querySelectorAll('[data-node]').forEach(el=>{el.onclick=e=>{e.stopPropagation();selectNode(el.dataset.node)};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(el.dataset.node)}}});bindGraphPan(svg)}
function transformGraph(){const vp=$('#viewport');if(vp)vp.setAttribute('transform',`translate(${500+state.pan[0]},${370+state.pan[1]}) scale(${state.zoom}) translate(-500,-370)`);if($('#zoom-label'))$('#zoom-label').textContent=Math.round(state.zoom*100)+'%'}
function bindGraphPan(svg){let drag=null;svg.onpointerdown=e=>{if(e.target.closest('.graph-node'))return;drag={x:e.clientX,y:e.clientY,px:state.pan[0],py:state.pan[1]};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;const r=svg.getBoundingClientRect();const f=1000/r.width;state.pan=[drag.px+(e.clientX-drag.x)*f,drag.py+(e.clientY-drag.y)*f];transformGraph()};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;svg.onwheel=e=>{e.preventDefault();state.zoom=Math.max(.5,Math.min(3,state.zoom*(e.deltaY<0?1.1:.9)));transformGraph()}}

function tasksView(){if(state.task)return taskDetail();return `<section class="page"><div class="page-head"><div><div class="eyebrow">LEARNING BY DOING</div><h2>在一个街区里，练成一组能力。</h2><p>8 个任务构成完整交付链。每个领域建议 12 学时，其中实训 8 学时；全课共 96 学时。</p></div><span class="tag warm">场景与数据均为教学设计</span></div><div class="cards">${DATA.tasks.map((t,i)=>`<button class="task-card" data-task="${t.id}"><div class="card-no">${String(i+1).padStart(2,'0')} <span class="tiny" style="float:right;margin-top:12px">${mod(t.module).title}</span></div><h3>${t.title}</h3><p>${t.description}</p><div class="card-foot"><span>4 项能力 · 实训 8h</span><span>${state.scores[t.id]?'已有评价':'进入任务'} ↗</span></div></button>`).join('')}</div><div class="callout" style="margin-top:22px">可先从任务 03 或 06 开始：内置合成设施样本支持数据质量检查与参数分析。模型融合等任务需在 GIS / BIM 软件中完成，本站提供任务单、知识导航和成果评价。</div></section>`}
function taskDetail(){const t=DATA.tasks.find(t=>t.id===state.task),s=state.scores[t.id]||{values:[0,0,0,0],proof:'',reviewer:''};return `<section class="page"><button class="back" data-action="tasks-back">← 返回任务工坊</button><div class="page-head"><div><div class="eyebrow">${t.id} / ${mod(t.module).title}</div><h2>${t.title}</h2><p>${t.description}</p></div>${btn('下载任务单 ↗','task-export','btn small',`data-id="${t.id}"`)}</div><div class="task-layout"><div><div class="callout"><b>输入资源</b><br>${t.resources}</div><h3>从输入到交付</h3><ol class="steps">${t.steps.map(s=>`<li>${s}</li>`).join('')}</ol><h3>关联能力与交付证据</h3>${t.abilities.map(a=>nodeLink(a,nodeById(a).evidence)).join('')}<div class="actions" style="margin-top:20px">${btn('下载合成设施 CSV','sample','btn small')}${btn('本领域知识自测','quiz-module','btn small',`data-id="${t.module}"`)}</div></div><div><div class="rubric"><div class="eyebrow">EVIDENCE-BASED ASSESSMENT</div><h3>成果评价量规</h3><p class="fine">0 无证据 / 1 需要指导 / 2 独立完成 / 3 能解释并迁移。每项权重相同。此为本地教学评价记录。</p>${t.criteria.map((c,i)=>`<div class="rubric-row"><label for="criterion-${i}">${c}</label><select id="criterion-${i}" class="criterion" data-i="${i}">${[0,1,2,3].map(v=>`<option value="${v}" ${s.values[i]===v?'selected':''}>${v} · ${['无证据','需指导','独立完成','解释与迁移'][v]}</option>`).join('')}</select></div>`).join('')}<div class="field"><label for="evidence-note">成果位置与评价依据</label><textarea id="evidence-note" placeholder="记录作品位置、版本、复核过程与结论；本页面不上传文件。">${esc(s.proof)}</textarea></div><div class="field"><label for="reviewer">评价方式 / 评价人（选填）</label><input id="reviewer" placeholder="例如：自评 / 小组互评" value="${esc(s.reviewer||'')}"></div><div class="actions">${btn('保存评价档案','save-rubric','btn dark')}<span class="fine" id="rubric-total">${Math.round(s.values.reduce((a,b)=>a+b,0)/12*100)} / 100</span></div>${s.time?`<p class="tiny">最近保存：${esc(s.time)}</p>`:''}</div></div></div>${['T3','T6','T5'].includes(t.id)?labHTML():''}</section>`}
const sample=[['F01','图书馆','建筑',80,65,4.2,'正常'],['F02','教学楼A','建筑',190,70,3.8,'正常'],['F03','教学楼B','建筑',350,85,2.4,'正常'],['F04','雨水泵站','设施',440,220,1.5,'待检'],['F05','地下车库','设施',310,265,'','正常'],['F06','体育馆','建筑',140,240,5.1,'正常'],['F07','配电房','设施',60,175,2.8,'正常'],['F08','路灯组','设施',240,180,3.2,'异常枚举'],['F09','食堂','建筑',410,320,3.6,'正常'],['F10','宿舍','建筑',205,340,4.6,'正常'],['F11','消防栓','设施',55,330,2.1,'正常'],['F01','图书馆副本','建筑',80,65,4.2,'正常']];
function sampleQuality(){const seen=new Set();let errors=[],valid=[];sample.forEach((r,i)=>{let errs=[];if(seen.has(r[0]))errs.push('重复对象ID');seen.add(r[0]);if(r[5]===''||!Number.isFinite(+r[5]))errs.push('高程缺失');if(!['正常','待检'].includes(r[6]))errs.push('状态超出值域');if(errs.length)errors.push({row:i+2,id:r[0],msg:errs.join('、')});else valid.push(r)});return{errors,valid}}
function labHTML(){let q=sampleQuality();return `<section class="lab"><div class="lab-top"><div><b>街区分析小实验</b><div class="tiny">合成样本 · 局部平面坐标 / 米 · 教学阈值</div></div>${btn('查看数据检查结果','quality','btn small')}</div><div class="lab-view"><svg id="lab-map" viewBox="0 0 500 400" role="img" aria-label="合成街区设施空间分析"></svg><div class="lab-controls"><label>服务半径 <b id="radius-label">${state.labRadius} m</b><input type="range" id="lab-radius" min="50" max="350" step="10" value="${state.labRadius}" aria-label="服务半径"></label><label>情景水位 <b id="water-label">${state.labWater.toFixed(1)} m</b><input type="range" id="lab-water" min="0" max="6" step="0.1" value="${state.labWater}" aria-label="情景水位"></label><div class="lab-result" id="lab-result"></div><p class="fine">点击设施查看属性。绿圈以中心点 (250, 200) 计算平面直线距离；橙色表示高程低于情景水位。</p><p class="tiny">质量门禁后 ${q.valid.length} 条有效记录参与计算。该实验为静态阈值筛查，不模拟水动力、路网通达或真实灾害。</p>${btn('导出分析结果 CSV','lab-export','btn small')}</div></div></section>`}
function labAnalysis(){return sampleQuality().valid.map(r=>({row:r,distance:Math.hypot(r[3]-250,r[4]-200),covered:Math.hypot(r[3]-250,r[4]-200)<=state.labRadius,affected:+r[5]<state.labWater}))}
function renderLab(){const svg=$('#lab-map');if(!svg)return;const rs=labAnalysis();svg.innerHTML=`<defs><pattern id="labgrid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#dae1d1" stroke-width="1"/></pattern></defs><rect width="500" height="400" fill="url(#labgrid)"/><path d="M0 125H500M270 0V400" stroke="#f7f7ef" stroke-width="28"/><path d="M0 125H500M270 0V400" stroke="#cbd5c2" stroke-width="1" stroke-dasharray="7 7"/><circle cx="250" cy="200" r="${state.labRadius}" fill="#7eac8520" stroke="#6e9976" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="250" cy="200" r="5" fill="#385e43"/><text x="260" y="197" font-size="9" fill="#637d59">服务点</text>${rs.map(o=>{const r=o.row;return `<g data-asset="${r[0]}" role="button" tabindex="0" aria-label="${r[1]}" style="cursor:pointer"><rect x="${r[3]-15}" y="${r[4]-12}" width="30" height="24" rx="3" fill="${o.affected?'#ca886b':'#9fb496'}" stroke="${state.labSelected===r[0]?'#314e3a':'#f2f2e8'}" stroke-width="${state.labSelected===r[0]?3:1}"/><text x="${r[3]}" y="${r[4]+25}" text-anchor="middle" font-size="10" fill="#4d684a">${r[1]}</text></g>`}).join('')}<text x="14" y="385" font-size="9" fill="#8b9c83">合成教学街区 / X 0—500 m · Y 0—400 m</text>`;const chosen=rs.find(o=>o.row[0]===state.labSelected);$('#lab-result').innerHTML=`覆盖 <b>${rs.filter(o=>o.covered).length} / ${rs.length}</b> 个对象<br>低于水位 <b>${rs.filter(o=>o.affected).length}</b> 个对象${chosen?`<hr style="border:0;border-top:1px solid #cbd6c1"><b>${chosen.row[1]}</b> · ${chosen.row[0]}<br>高程 ${chosen.row[5]} m / 距离 ${chosen.distance.toFixed(1)} m`:''}`;svg.querySelectorAll('[data-asset]').forEach(el=>{el.onclick=()=>{state.labSelected=el.dataset.asset;renderLab()};el.onkeydown=e=>{if(e.key==='Enter'){state.labSelected=el.dataset.asset;renderLab()}}});$('#radius-label').textContent=state.labRadius+' m';$('#water-label').textContent=state.labWater.toFixed(1)+' m'}
function prereqOrder(target){let seen=new Set(),order=[];function walk(id){if(seen.has(id))return;seen.add(id);const n=nodeById(id);if(!n)return;(n.prerequisites||[]).forEach(walk);order.push(n)}walk(target);return order}
function pathsView(){const order=prereqOrder(state.target),pending=order.filter(a=>+state.status[a.id]!==2),role=DATA.roles.find(r=>r.id===state.role);return `<section class="page"><div class="page-head"><div><div class="eyebrow">BUILD YOUR LEARNING PATH</div><h2>从目标出发，找到下一步。</h2><p>前置关系是教学建议。路径按依赖顺序展开，自评掌握的能力可选择复习。</p></div>${btn('打印 / 保存 PDF','print','btn small')}</div><div class="paths-layout"><div><div class="field"><label for="role-select">目标岗位方向</label><select id="role-select">${DATA.roles.map(r=>`<option value="${r.id}" ${r.id===state.role?'selected':''}>${r.title}</option>`).join('')}</select></div><p class="fine">${role.desc}</p><div class="field"><label for="target-select">本次目标能力</label><select id="target-select">${abilities().filter(a=>role.modules.includes(mod(a.module).index)).map(a=>`<option value="${a.id}" ${a.id===state.target?'selected':''}>${a.id} · ${a.title}</option>`).join('')}</select></div><div class="callout"><b>${order.length}</b> 项路径能力<br><b>${pending.length*3} h</b> 尚未自评掌握的建议学习量<p class="tiny">每项能力按 3 学时估算，已包含所属领域的理论与实践分配；不是额外学时。</p></div>${pending[0]?btn('开始下一项 →','start-next','btn dark',`data-id="${pending[0].id}"`):'<p class="fine">本路径已全部自评掌握，可进入实训复核。</p>'}</div><div class="path-list">${order.map((a,i)=>`<button class="path-step" data-node="${a.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><b>${a.title}</b><small>${mod(a.module).title} · ${statusNames[state.status[a.id]||0]}</small></span><span class="hours">3h ↗</span></button>`).join('')}</div></div></section>`}
function assessmentView(){const answered=Object.keys(state.answers).length,correct=Object.entries(state.answers).filter(([id,v])=>DATA.questions.find(q=>q.id===id)?.answer===v).length,records=Object.keys(state.scores).length;return `<section class="page"><div class="page-head"><div><div class="eyebrow">MY LEARNING PORTFOLIO</div><h2>用证据，看见自己的成长。</h2><p>学习记录保存在当前浏览器。自评、知识测验和任务评价分别呈现。</p></div><div class="actions">${btn('开始 16 题诊断','quiz-all','btn dark')}${btn('导出学习档案','portfolio','btn')}</div></div><div class="assessment-top"><div class="metric-box"><strong>${ratio()}<small style="font:17px system-ui">%</small></strong><span>能力自评掌握 · ${abilities().filter(a=>+state.status[a.id]===2).length} / 32</span></div><div class="metric-box"><strong>${correct}<small style="font:17px system-ui"> / 16</small></strong><span>知识诊断答对 · 已作答 ${answered} 题</span></div><div class="metric-box"><strong>${records}<small style="font:17px system-ui"> / 8</small></strong><span>已留存任务评价记录</span></div></div><div class="domain-grid">${DATA.modules.map(m=>`<div class="domain-box"><h3>${m.title}</h3><div class="progressline"><i style="width:${ratio(m.id)}%;background:${m.color}"></i></div><span>${ratio(m.id)}% 自评掌握</span><button class="editbtn" style="float:right;margin-top:0" data-action="quiz-module" data-id="${m.id}">自测 →</button></div>`).join('')}</div><h3 class="small-title">任务证据索引</h3><div class="matrix-wrap"><table class="matrix"><thead><tr><th>实训任务</th><th>评价得分</th><th>证据说明</th><th>记录时间</th></tr></thead><tbody>${DATA.tasks.map(t=>{const s=state.scores[t.id];return `<tr><td><button data-task="${t.id}">${t.id} · ${t.title} ↗</button></td><td>${s?Math.round(s.values.reduce((a,b)=>a+b,0)/12*100)+'/100':'未评价'}</td><td>${s?esc(s.proof.slice(0,60)):'待补充成果'}</td><td>${s?esc(s.time):'—'}</td></tr>`}).join('')}</tbody></table></div><div class="callout" style="margin-top:22px">本档案用于教学诊断与复盘，不构成官方职业认证。测验正确率与自评进度不自动转换为任务能力得分。</div><div class="actions no-print">${btn('导入学习档案','import-progress','btn small')}${btn('打印评价报告','print','btn small')}</div><input type="file" id="progress-file" accept="application/json,.json" hidden></section>`}
function sourcesView(){return `<section class="page"><div class="page-head"><div><div class="eyebrow">SOURCES & METHODOLOGY</div><h2>每一条关联，都说明来处。</h2><p>核查日期：2026年10月25日。标准依据与课程教学设计分层呈现。</p></div><span class="tag">来源核查</span></div><div class="callout warm"><b>用户指定文章 · 正文待核查</b><p>${DATA.article.status}</p><p>微信文章正文未能读取，目前尚未完成文章观点与本图谱的逐项映射。</p><a href="${DATA.article.url}" target="_blank" rel="noopener">打开用户提供的原文 ↗</a></div><div class="callout"><b>建模方法</b><p>以岗位任务反推能力，把每项能力拆解为知识与可观察动作，再关联实训任务和成果证据。图谱包含课程1、能力域8、能力32、知识128、任务8、证据32、岗位方向4，共213个节点，390条关系。</p><p>事实A：教育部2025年教学标准列出 CIM 创建、可视化与城市管理应用。事实B：CJJ/T 315—2022提供CIM基础平台行业框架。A + B ⇒ 本课程据此设计“业务—数据—治理—模型—平台—应用—运营—交付”教学链。该八域结构是本次课程设计结论。</p><p>${DATA.designNote} 学时分配为每域12学时，其中理论4、实训8；知识点解释、练习、岗位标签和评分量规为编写内容。节点中的来源用于框架依据和延伸阅读，不代表每句细目都是标准原文。</p></div><div class="sources">${DATA.sources.map(s=>`<article class="source-card"><span class="tag">${s.id} · ${s.year}</span><h3>${s.title}</h3><p>${s.org}<br>${s.locator}</p><p>${s.scope}</p><a href="${s.url}" target="_blank" rel="noopener">查阅官方来源 ↗</a></article>`).join('')}</div><h3 class="small-title">使用与数据边界</h3><p class="fine">内置设施表是合成教学数据，不对应任何真实学校、测绘成果或监测设施。学习状态、笔记、节点编辑与任务评价存储在当前浏览器，可导出备份；网站不配置服务器端学生账户、班级管理或真实CIM后台。外部标准链接需联网，图谱、测验和合成数据实验可离线使用。</p></section>`}
function openModal(html){$('#modal-inner').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
function modalHead(title){return `<div class="modal-head"><h2>${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="关闭弹窗">×</button></div>`}
function closeModal(){$('#modal').close()}
let quiz={list:[],i:0,chosen:null};
function startQuiz(module){quiz={list:DATA.questions.filter(q=>!module||q.module===module),i:0,chosen:null};showQuiz()}
function showQuiz(){if(quiz.i>=quiz.list.length){const right=quiz.list.filter(q=>state.answers[q.id]===q.answer).length;openModal(modalHead('诊断完成')+`<div class="metric-box"><strong>${right} / ${quiz.list.length}</strong><span>本次知识诊断答对题数</span></div><p class="fine">答案已保存至当前浏览器。查看对应能力，补充任务成果后再进行能力评价。</p>${quiz.list.filter(q=>state.answers[q.id]!==q.answer).map(q=>nodeLink(q.ability,'建议复习 · '+q.q)).join('')}<div style="margin-top:20px">${btn('查看评价档案','quiz-finish','btn dark')}</div>`);return}const q=quiz.list[quiz.i];openModal(modalHead('知识诊断')+`<div class="eyebrow">${quiz.i+1} / ${quiz.list.length} · ${mod(q.module).title}</div><h3 style="font-size:18px;font-weight:500;margin-top:22px">${q.q}</h3><div class="quiz-options">${q.options.map((o,i)=>`<button data-answer="${i}" ${quiz.chosen!==null?'disabled':''} class="${quiz.chosen===null?'':i===q.answer?'correct':i===quiz.chosen?'wrong':''}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${quiz.chosen!==null?`<div class="quiz-feedback"><b>${quiz.chosen===q.answer?'回答正确':'再理解一下这个概念'}</b><br>${q.explanation}</div>${btn(quiz.i===quiz.list.length-1?'查看结果 →':'下一题 →','quiz-next','btn dark')}`:'<p class="fine">选择一个答案，立即查看解释与对应能力。</p>'}`)}
function download(name,text,mime='text/plain;charset=utf-8'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成下载文件')}
function csv(rows){return '\ufeff'+rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}

function exportTask(id){const t=DATA.tasks.find(t=>t.id===id);const md=`# ${t.id} ${t.title}\n\n编制：2026-10-25 · 课程教学设计\n\n## 场景\n${t.description}\n\n## 资源\n${t.resources}\n\n## 实施步骤\n${t.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n## 能力与成果\n${t.abilities.map(a=>`- ${a} ${nodeById(a).title}：${nodeById(a).evidence}`).join('\n')}\n\n## 评价量规\n每项0—3分：0无证据、1需指导、2独立完成、3解释与迁移；等权换算百分制。\n${t.criteria.map(c=>'- '+c).join('\n')}\n\n建议实训8学时，包含在本领域12学时中。数据与阈值为教学设计。\n`;download(`${t.id}_CIM实训任务单.md`,md)}
function exportSVG(){const svg=$('#graph');if(!svg){toast('请先进入图谱探索，再导出当前视图');closeModal();go('graph');return}const c=svg.cloneNode(true);c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('width','1400');c.setAttribute('height','1036');c.insertAdjacentHTML('afterbegin','<style>.graph-edge{stroke:#a6b8a2;stroke-opacity:.48;fill:none}.hover-label{opacity:0}text{font-family:Arial,Microsoft YaHei,sans-serif}</style><rect width="1000" height="740" fill="#f6f6f0"/>');download('CIM当前图谱.svg',new XMLSerializer().serializeToString(c),'image/svg+xml')}
function exportMenu(){openModal(modalHead('把图谱带到你的课堂')+`<p class="fine">离线 HTML 包含课程内容与交互；个人进度请单独导出学习档案。</p><div class="export-grid">${btn('离线网站 HTML<small>双击打开 · 内嵌全部资源</small>','html','')}${btn('图谱数据 JSON<small>节点、关系、任务与来源</small>','json','')}${btn('能力矩阵 CSV<small>岗位映射与学习状态</small>','csv','')}${btn('当前图谱 SVG<small>可缩放矢量图</small>','svg','')}${btn('学习档案 JSON<small>进度、笔记、测验与评价</small>','portfolio','')}${btn('打印 / 保存 PDF<small>打印当前页面内容</small>','print','')}</div><p class="fine">也可下载<a href="cim-atlas-offline.html" download="CIM能力图谱_原始离线版.html">原始离线版 HTML ↗</a>（不包含本地编辑）。</p>`)}
function importPortfolio(file){if(!file)return;if(file.size>3000000){toast('文件过大，请选择本站导出的学习档案');return}const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.schema!=='cim-portfolio-1')throw Error('format');const valid=new Set(DATA.nodes.map(n=>n.id));for(const [k,v]of Object.entries(d.status||{}))if(valid.has(k)&&[0,1,2].includes(v))state.status[k]=v;for(const [k,v]of Object.entries(d.notes||{}))if(valid.has(k)&&typeof v==='string')state.notes[k]=v.slice(0,20000);for(const [k,v]of Object.entries(d.answers||{}))if(DATA.questions.some(q=>q.id===k)&&[0,1,2].includes(v))state.answers[k]=v;for(const [k,v]of Object.entries(d.scores||{}))if(DATA.tasks.some(t=>t.id===k)&&Array.isArray(v.values)&&v.values.length===4&&v.values.every(x=>[0,1,2,3].includes(x))&&typeof v.proof==='string')state.scores[k]={values:v.values,proof:v.proof.slice(0,20000),reviewer:String(v.reviewer||'').slice(0,100),time:String(v.time||'导入记录').slice(0,50)};persist();render();toast('学习档案已合并导入')}catch{toast('文件格式不匹配，请使用本站导出的学习档案')}};reader.readAsText(file)}
function bind(){if($('#search'))$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),box=$('#search-results');if(!q){box.hidden=true;return}const matches=DATA.nodes.map(n=>nodeById(n.id)).filter(n=>(n.id+' '+n.title+' '+n.description).toLowerCase().includes(q)).slice(0,18);box.hidden=false;box.innerHTML=matches.length?matches.map(n=>`<button data-node="${n.id}">${esc(n.title)}<small>${types[n.type]} · ${n.id}</small></button>`).join(''):'<div class="empty">没有匹配结果，请尝试 BIM、坐标或应急。</div>'};if($('#mastery'))$('#mastery').onchange=e=>{state.status[state.selected]=+e.target.value;persist();toast('已更新学习状态');if(state.view==='graph')drawGraph();const sb=$('.sidebar-bottom');if(sb){sb.querySelector('b').textContent=ratio()+'%';sb.querySelector('.progressline i').style.width=ratio()+'%';sb.querySelector('.tiny').textContent=abilities().filter(a=>+state.status[a.id]===2).length+' / 32 项能力自评掌握'}};if($('#role-select'))$('#role-select').onchange=e=>{state.role=e.target.value;const role=DATA.roles.find(r=>r.id===state.role);if(!role.modules.includes(mod(nodeById(state.target).module).index))state.target='A'+(role.modules[0]+1)+'1';render()};if($('#target-select'))$('#target-select').onchange=e=>{state.target=e.target.value;render()};$$('.criterion').forEach(el=>el.onchange=()=>$('#rubric-total').textContent=Math.round($$('.criterion').reduce((s,e)=>s+ +e.value,0)/12*100)+' / 100');if($('#lab-radius'))$('#lab-radius').oninput=e=>{state.labRadius=+e.target.value;renderLab()};if($('#lab-water'))$('#lab-water').oninput=e=>{state.labWater=+e.target.value;renderLab()};if($('#progress-file'))$('#progress-file').onchange=e=>importPortfolio(e.target.files[0])}
const actions={
'mobilegraph':()=>{state.mobileGraph=!state.mobileGraph;render()},'relations':()=>{state.layout=state.layout==='relations'?'domain':'relations';state.zoom=1;state.pan=[0,0];render()},'overview':()=>selectModule('all'),'focus':()=>selectModule(state.module||'M4'),'labels':()=>{state.filter=state.filter==='ability'?'all':'ability';if(!state.module)state.module='M4';render()},
'zoomin':()=>{state.zoom=Math.min(3,state.zoom*1.2);transformGraph()},'zoomout':()=>{state.zoom=Math.max(.5,state.zoom/1.2);transformGraph()},'fit':()=>{state.zoom=1;state.pan=[0,0];transformGraph()},
'close-inspector':()=>{state.drawer=false;$('#inspector').classList.remove('open')},'close-modal':closeModal,
'path-target':el=>{state.target=el.dataset.id;const r=DATA.roles.find(r=>r.modules.includes(mod(nodeById(state.target).module).index));state.role=r.id;go('paths')},
'start-next':el=>selectNode(el.dataset.id),'open-task':el=>{state.view='tasks';state.task=el.dataset.id;state.drawer=false;location.hash='tasks';render()},'tasks-back':()=>{state.task=null;render()},
'save-note':()=>{state.notes[state.selected]=$('#node-note').value;if(persist())toast('学习笔记已保存')},
'quiz-module':el=>startQuiz(el.dataset.id),'quiz-all':()=>startQuiz(null),'quiz-next':()=>{quiz.i++;quiz.chosen=null;showQuiz()},'quiz-finish':()=>{closeModal();go('assessment')},
'save-rubric':()=>{const proof=$('#evidence-note').value.trim();if(!proof){toast('请先填写成果位置与评价依据');$('#evidence-note').focus();return}state.scores[state.task]={values:$$('.criterion').map(e=>+e.value),proof,reviewer:$('#reviewer').value,time:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})};if(persist())toast('评价与证据已保存');render()},
'quality':()=>{const q=sampleQuality();openModal(modalHead('合成数据质量检查')+`<p class="fine">按ID唯一、高程必填、状态值域三个规则检查，原始12条，异常${q.errors.length}条，有效${q.valid.length}条。原始数据保留，分析仅使用有效子集。</p><table class="matrix"><thead><tr><th>CSV行号</th><th>对象ID</th><th>问题</th></tr></thead><tbody>${q.errors.map(e=>`<tr><td>${e.row}</td><td>${e.id}</td><td>${e.msg}</td></tr>`).join('')}</tbody></table><p class="fine">重复项保留首条作为教学规则；真实项目需结合源数据和业务规则进行冲突复核。</p>`)},
'lab-export':()=>download('CIM合成街区分析.csv',csv([['合成对象ID','名称','高程_m','距服务点_m','半径_m','覆盖','情景水位_m','低于水位'],...labAnalysis().map(o=>[o.row[0],o.row[1],o.row[5],o.distance.toFixed(2),state.labRadius,o.covered?'是':'否',state.labWater,o.affected?'是':'否'])]),'text/csv;charset=utf-8'),
'sample':()=>download('CIM合成设施样本.csv',csv([['object_id','name','type','x_m','y_m','elevation_m','status'],...sample]),'text/csv;charset=utf-8'),
'edit-node':el=>{const n=nodeById(el.dataset.id);openModal(modalHead('编辑课程节点')+`<p class="fine">修改仅保存至当前浏览器。图谱数据和离线 HTML 导出会包含编辑后的名称与说明。</p><div class="field"><label for="edit-title">名称</label><input id="edit-title" maxlength="60" value="${esc(n.title)}"></div><div class="field"><label for="edit-desc">说明</label><textarea id="edit-desc" maxlength="4000">${esc(n.description)}</textarea></div><div class="actions">${btn('保存修改','save-edit','btn dark',`data-id="${n.id}"`)}${btn('恢复此节点原文','reset-edit','btn',`data-id="${n.id}"`)}</div>`)},
'save-edit':el=>{const title=$('#edit-title').value.trim(),description=$('#edit-desc').value.trim();if(!title||!description){toast('请填写名称与说明');return}state.edits[el.dataset.id]={title,description};persist();closeModal();render();toast('节点已更新')},
'reset-edit':el=>{delete state.edits[el.dataset.id];persist();closeModal();render();toast('已恢复原始课程内容')},
'html':exportHTML,'json':exportData,'csv':exportMatrix,'svg':exportSVG,'portfolio':exportPortfolio,'task-export':el=>exportTask(el.dataset.id),'print':()=>{closeModal();window.print()},'import-progress':()=>$('#progress-file').click()
};
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.view){closeModal();go(b.dataset.view)}else if(b.dataset.task){state.view='tasks';state.task=b.dataset.task;location.hash='tasks';render()}else if(b.dataset.module)selectModule(b.dataset.module);else if(b.dataset.matrix){state.module=b.dataset.matrix==='all'?null:b.dataset.matrix;render()}else if(b.dataset.node&&!b.closest('svg')){closeModal();selectNode(b.dataset.node)}else if(b.dataset.action&&actions[b.dataset.action])actions[b.dataset.action](b);else if(b.dataset.answer!==undefined&&quiz.chosen===null){quiz.chosen=+b.dataset.answer;state.answers[quiz.list[quiz.i].id]=quiz.chosen;persist();showQuiz()}});
$('#source-nav').onclick=()=>go('sources');$('#export-open').onclick=exportMenu;
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.view==='graph'){state.drawer=false;$('#inspector')?.classList.remove('open');if($('#search-results'))$('#search-results').hidden=true}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['graph','matrix','tasks','paths','assessment','sources'].includes(v)&&v!==state.view){state.view=v;state.task=null;render()}});
if(['graph','matrix','tasks','paths','assessment','sources'].includes(location.hash.slice(1)))state.view=location.hash.slice(1);render();

function mobileNodes(){return state.module?abilities(state.module).map(a=>`<button class="mobile-node-card" data-node="${a.id}"><span>${a.id} · ${a.level}</span><b>${a.title} ↗</b><small>${a.evidence}</small></button>`).join(''):DATA.modules.map(m=>`<button class="mobile-node-card" data-module="${m.id}"><span style="color:${m.color}">${String(m.index+1).padStart(2,'0')} / 4项能力 · 16知识点</span><b>${m.title} ↗</b><small>${m.subtitle}</small></button>`).join('')}
</script></body></html>

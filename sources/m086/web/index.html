<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f0ec"><title>拾光智能相册管理系统</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg"><defs id="iconDefs"></defs></svg>
<div class="app"><aside class="sidebar">
 <a class="brand" href="#" aria-label="拾光智能相册管理系统首页" title="拾光智能相册管理系统"><span class="brandmark"><i></i><i></i><i></i><i></i></span><span class="brand-copy"><span class="brand-name">拾光智能相册<br>管理系统</span><small>SHIGUANG</small></span></a>
 <div class="library-status"><span class="live-dot"></span> 你的照片，只在本机 <span class="status-lock">↗</span></div><div class="nav-label">照片资料库</div>
 <nav id="navigation" aria-label="主要导航"><button data-view="all" class="nav active"><svg><use href="#i-grid"/></svg><span>所有照片</span><b data-count="visible">0</b></button><button data-view="timeline" class="nav"><svg><use href="#i-clock"/></svg><span>时光轴</span></button><button data-view="people" class="nav"><svg><use href="#i-people"/></svg><span>人物</span><b data-count="people">0</b></button><button data-view="map" class="nav"><svg><use href="#i-pin"/></svg><span>足迹地图</span></button><button data-view="favorites" class="nav"><svg><use href="#i-heart"/></svg><span>收藏</span><b data-count="favorites">0</b></button></nav>
 <div class="nav-label">整理工作台</div><nav id="workbench"><button data-view="review" class="nav"><svg><use href="#i-people"/></svg><span>待确认人脸</span><b data-count="review">0</b></button><button data-view="undated" class="nav"><svg><use href="#i-clock"/></svg><span>日期待确认</span><b data-count="undated">0</b></button><button data-view="duplicates" class="nav"><svg><use href="#i-copy"/></svg><span>完全重复</span><b data-count="duplicates">0</b></button><button data-view="errors" class="nav"><svg><use href="#i-alert"/></svg><span>处理异常</span><b data-count="all_errors">0</b></button></nav>
 <div class="nav-label label-action">我的相册<button id="newAlbum" title="创建相册" aria-label="创建相册">＋</button></div><div id="albumsNav" class="compact-nav"></div>
 <div class="sidebar-bottom"><button id="sourcesBtn"><svg><use href="#i-folder"/></svg> 照片目录</button><button id="settingsBtn"><svg><use href="#i-settings"/></svg> 设置与备份</button><button id="helpBtn"><svg><use href="#i-info"/></svg> 使用指南</button><small>SHIGUANG · v1.0.1</small></div>
</aside><main class="main">
 <header class="topbar"><div class="breadcrumbs">我的资料库 <span>/</span> <span id="crumb">所有照片</span></div><div class="top-actions"><button id="selectMode" class="quiet">选择照片</button><button id="importBtn" class="primary"><svg><use href="#i-plus"/></svg> 添加照片目录</button></div></header>
 <section class="page-head"><div><div class="eyebrow" id="eyebrow">YOUR LIFE, IN FRAMES</div><h1 id="pageTitle">所有照片<span class="accent-dot">.</span></h1><p id="pageSubtitle">把散落的瞬间，放回时间里。</p></div><div class="head-stats" id="headStats"><div><strong id="statPhotos">0</strong><span>张照片</span></div><div><strong id="statPeople">0</strong><span>个人物分组</span></div><div><strong id="statYears">—</strong><span>记录跨度</span></div></div></section>
 <section class="toolbar" id="toolbar"><label class="search"><svg><use href="#i-search"/></svg><input id="searchInput" placeholder="搜索文件名、标签、备注…" aria-label="搜索照片"><kbd>/</kbd></label><button id="filtersBtn" class="quiet filter-button"><svg><use href="#i-settings"/></svg> 筛选<span id="filterDot" hidden>●</span></button><div class="toolbar-spacer"></div><select id="sortSelect" aria-label="排序"><option value="date_desc">时间 · 从新到旧</option><option value="date_asc">时间 · 从旧到新</option><option value="name">文件名称</option><option value="rating">评分优先</option></select><label class="density"><svg><use href="#i-grid"/></svg><input id="density" type="range" min="150" max="340" value="235" aria-label="缩略图大小"></label></section>
 <div id="filterChips" class="filter-chips" hidden></div><div id="selectionBar" class="selection-bar" hidden><span>已选择 <b id="selectedCount">0</b> 张</span><button data-batch="clear">取消</button><button data-batch="all">选择全部结果</button><span class="divider"></span><button data-batch="favorite">收藏</button><button data-batch="tags">标签</button><button data-batch="date">校正日期</button><button data-batch="album">加入相册</button><button data-batch="split" id="splitPeople" hidden>人物归属</button><button data-batch="removeAlbum" id="removeAlbum" hidden>移出相册</button><button data-batch="export" class="dark"><svg><use href="#i-download"/></svg> 导出原图</button></div>
 <section id="galleryShell" class="gallery-shell"><div id="galleryScroll" class="gallery-scroll" tabindex="0" aria-label="照片网格"><div id="virtualGallery" class="virtual-gallery"></div></div><aside id="yearRail" class="year-rail" aria-label="时间快速跳转"></aside></section>
 <section id="emptyState" class="empty-state" hidden></section><section id="peopleView" class="content-scroll" hidden></section><section id="reviewView" class="content-scroll" hidden></section>
 <section id="mapView" class="map-view" hidden><div class="map-controls"><span>照片中的 GPS · 离线世界概览</span><button id="mapOut" aria-label="缩小地图">−</button><button id="mapReset">复位</button><button id="mapIn" aria-label="放大地图">＋</button></div><svg id="worldMap" viewBox="0 0 1000 540" role="img" aria-label="照片地理位置地图"><g id="mapTransform"><g id="mapLand"></g><g id="mapDots"></g></g></svg><div class="map-attribution">Natural Earth · 公共领域底图 · 经度/纬度概览（不用于测量）</div><div id="mapHint"></div></section>
 <footer class="taskbar"><div id="taskIcon" class="task-icon"><svg><use href="#i-check"/></svg></div><div class="task-text"><strong id="taskTitle">准备记录你的时光</strong><span id="taskDetail">添加一个照片目录，开始建立本地照片库</span></div><div class="progress-wrap"><div class="progress-track"><div id="progressFill"></div></div><small id="progressLabel">全部内容在本机处理</small></div><button id="pauseBtn" class="quiet" hidden>暂停</button><button id="logsBtn" class="quiet">处理日志</button></footer>
</main></div>
<dialog id="formDialog" class="form-dialog"><div class="dialog-title"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-btn" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div><div id="dialogBody"></div><div id="dialogFooter" class="dialog-footer"></div></dialog>
<dialog id="viewer" class="viewer"><header class="viewer-top"><button id="closeViewer" class="icon-btn" title="关闭 · Esc"><svg><use href="#i-close"/></svg></button><div class="viewer-title"><strong id="viewerName"></strong><span id="viewerPosition"></span></div><div class="viewer-actions"><button id="viewFavorite" class="icon-btn" title="收藏"><svg><use href="#i-heart"/></svg></button><button id="slideshowBtn" class="icon-btn" title="自动播放 · 空格"><svg><use href="#i-play"/></svg></button><button id="fullscreenBtn" class="icon-btn" title="全屏"><svg><use href="#i-expand"/></svg></button><button id="infoBtn" class="icon-btn" title="照片信息"><svg><use href="#i-info"/></svg></button></div></header><div class="viewer-body"><div class="viewer-stage" id="viewerStage"><button id="prevPhoto" class="photo-arrow prev" aria-label="上一张"><svg><use href="#i-arrow"/></svg></button><div id="photoTransform" class="photo-transform"><img id="fullPhoto" alt="高清照片" draggable="false"><svg id="faceOverlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div><div id="viewerLoad" class="viewer-loading">正在读取照片…</div><button id="nextPhoto" class="photo-arrow next" aria-label="下一张"><svg><use href="#i-arrow"/></svg></button><div class="zoom-control"><button id="zoomOut" aria-label="缩小">−</button><button id="zoomFit">适应窗口</button><button id="zoomIn" aria-label="放大">＋</button><button id="fullRes">原尺寸</button></div></div><aside id="viewerInfo" class="viewer-info"></aside></div><footer class="viewer-bottom"><span id="viewerDate"></span><div><button id="facesToggle">显示人脸框</button><button id="manualFace">手动补录人脸</button><button id="downloadOriginal"><svg><use href="#i-download"/></svg> 导出原图</button></div></footer></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="connectionBanner" class="connection-banner" hidden></div><script src="app.js" defer></script><script src="viewer.js" defer></script></body></html>

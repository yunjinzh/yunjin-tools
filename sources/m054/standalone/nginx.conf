server {
    listen 80;
    server_name _;
    root /var/www/yunjin-portfolio/site;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(woff2|png|jpg|jpeg|gif|webp|avif|svg|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

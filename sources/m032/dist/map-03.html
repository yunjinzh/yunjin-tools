const q=new URLSearchParams(location.search);let n=Number(window.MAP_DAY||q.get('day')||1);if(!Number.isInteger(n)||n<1||n>30)n=1;const m=window.MAP_RECORD||MAPS[n-1];document.title=m.title+' · 交互地图';document.querySelector('#navTitle').textContent=m.themeZh+' / DAY '+m.id;document.querySelector('#mapDay').textContent='DAY '+m.id+' / '+m.theme;document.querySelector('#mapTitle').textContent=m.title;document.querySelector('#mapDescription').textContent=m.description;document.querySelector('#position').textContent=m.id+' / 30';document.querySelector('#fullLink').href=`assets/originals/${m.id}.png`;document.querySelector('#previousDay').href='map-'+String(n===1?30:n-1).padStart(2,'0')+'.html';document.querySelector('#nextDay').href='map-'+String(n===30?1:n+1).padStart(2,'0')+'.html';const viewport=document.querySelector('#viewport'),plane=document.querySelector('#mapPlane'),art=document.querySelector('#mapArtwork'),mini=document.querySelector('#minimap'),miniWindow=document.querySelector('#miniWindow'),lens=document.querySelector('#lens');art.src=m.preview;art.alt=m.title;document.querySelector('#miniImage').src=m.preview;plane.style.width=m.width+'px';plane.style.height=m.height+'px';let fit=1,scale=1,x=0,y=0,ready=true,points=new Map(),drag=null,pinch=null,lensOn=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function draw(){plane.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.querySelector('#zoomValue').textContent=Math.round(scale/fit*100)+'%';const vw=viewport.clientWidth,vh=viewport.clientHeight,mw=mini.clientWidth,mh=mini.clientHeight;const left=clamp(-x/(m.width*scale),0,1),top=clamp(-y/(m.height*scale),0,1),right=clamp((vw-x)/(m.width*scale),0,1),bottom=clamp((vh-y)/(m.height*scale),0,1);miniWindow.style.cssText=`left:${left*mw}px;top:${top*mh}px;width:${Math.max(0,right-left)*mw}px;height:${Math.max(0,bottom-top)*mh}px`;}function constrain(){const w=m.width*scale,h=m.height*scale,vw=viewport.clientWidth,vh=viewport.clientHeight;x=w<v

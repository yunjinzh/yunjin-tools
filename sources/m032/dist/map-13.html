const q=new URLSearchParams(location.search);let n=Number(window.MAP_DAY||q.get('day')||1);if(!Number.isInteger(n)||n<1||n>30)n=1;const m=window.MAP_RECORD||MAPS[n-1];document.title=m.title+' · 交互地图';document.querySelector('#navTitle').textContent=m.themeZh+' / DAY '+m.id;document.querySelector('#mapDay').textContent='DAY '+m.id+' / '+m.theme;document.querySelector('#mapTitle').textContent=m.title;document.querySelector('#mapDescription').textContent=m.description;document.querySelector('#position').textContent=m.id+' / 30';document.querySelector('#fullLink').href=`assets/originals/${m.id}.png`;document.querySelector('#previousDay').href='map-'+String(n===1?30:n-1).padStart(2,'0')+'.html';document.querySelector('#nextDay').href='map-'+String(n===30?1:n+1).padStart(2,'0')+'.html';const viewport=document.querySelector('#viewport'),plane=document.querySelector('#mapPlane'),art=document.querySelector('#mapArtwork'),mini=document.querySelector('#minimap'),miniWindow=document.querySelector('#miniWindow'),lens=document.querySelector('#lens');art.src=m.preview;art.alt=m.title;document.querySelector('#miniImage').src=m.preview;plane.style.width=m.width+'px';plane.style.height=m.height+'px';let fit=1,scale=1,x=0,y=0,ready=true,points=new Map(),drag=null,pinch=null,lensOn=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function draw(){plane.style.transform=`translate(${x}px,${y}px) scale(${scale})`;document.querySelector('#zoomValue').textContent=Math.round(scale/fit*100)+'%';const vw=viewport.clientWidth,vh=viewport.clientHeight,mw=mini.clientWidth,mh=mini.clientHeight;const left=clamp(-x/(m.width*scale),0,1),top=clamp(-y/(m.height*scale),0,1),right=clamp((vw-x)/(m.width*scale),0,1),bottom=clamp((vh-y)/(m.height*scale),0,1);miniWindow.style.cssText=`left:${left*mw}px;top:${top*mh}px;width:${Math.max(0,right-left)*mw}px;height:${Math.max(0,bottom-top)*mh}px`;}function constrain(){const w=m.width*scale,h=m.height*scale,vw=viewport.clientWidth,vh=viewport.clientHeight;x=w<vw?(vw-w)/2:clamp(x,vw-w-40,40);y=h<vh?(vh-h)/2:clamp(y,vh-h-40,40)}function reset(){if(!ready)return;fit=Math.max(.05,Math.min((viewport.clientWidth-60)/m.width,(viewport.clientHeight-95)/m.height));scale=fit;x=(viewport.clientWidth-m.width*scale)/2;y=(viewport.clientHeight-m.height*scale)/2;draw();selectFocus('whole')}function selectFocus(key){document.querySelectorAll('[data-focus]').forEach(b=>{b.classList.toggle('selected',b.dataset.focus===key);b.setAttribute('aria-pressed',b.dataset.focus===key?'true':'false')})}function zoom(factor,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){if(!ready)return;const next=clamp(scale*factor,fit*.7,fit*8),r=next/scale;x=cx-(cx-x)*r;y=cy-(cy-y)*r;scale=next;constrain();draw();selectFocus('');}document.querySelector('#mapLoading').hidden=true;document.querySelector('#miniImage').onload=()=>draw();reset();let activeImage=m.preview;const high=new Image();high.onload=()=>{activeImage=high.src;art.src=activeImage;document.querySelector('#qualityStatus').textContent='高清画面已载入'};high.onerror=()=>{document.querySelector('#qualityStatus').textContent='预览模式 · 点击重试高清';document.querySelector('#qualityStatus').onclick=()=>{high.src=`assets/full/${m.id}.jpg?retry=${Date.now()}`}};high.src=`assets/full/${m.id}.jpg?v=2`;document.querySelector('#zoomIn').onclick=()=>zoom(1.3);document.querySelector('#zoomOut').onclick=()=>zoom(1/1.3);document.querySelector('#resetView').onclick=reset;document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const key=b.dataset.focus;if(key==='whole')return reset();scale=fit*2.6;const cy={top:.24,middle:.5,bottom:.77}[key];x=viewport.clientWidth/2-m.width*.5*scale;y=viewport.clientHeight/2-m.height*cy*scale;constrain();draw();selectFocus(key)});viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0014),e.clientX-r.left,e.clientY-r.top)},{passive:false});viewport.addEventListener('dblclick',e=>{const r=viewport.getBoundingClientRect();zoom(1.7,e.clientX-r.left,e.clientY-r.top)});function xy(e){const r=viewport.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,input'))return;viewport.focus({preventScroll:true});viewport.setPointerCapture(e.pointerId);points.set(e.pointerId,xy(e));viewport.classList.add('dragging');document.querySelector('#canvasInstruction').style.opacity='0';if(points.size===1){drag={...xy(e),ox:x,oy:y}}else if(points.size===2){const a=[...points.values()];const cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;pinch={d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),s:scale,ix:(cx-x)/scale,iy:(cy-y)/scale};drag=null}lens.hidden=true});viewport.addEventListener('pointermove',e=>{const p=xy(e);if(points.has(e.pointerId)){points.set(e.pointerId,p);if(points.size===2&&pinch){const a=[...points.values()],d=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y);scale=clamp(pinch.s*d/Math.max(1,pinch.d),fit*.7,fit*8);x=(a[0].x+a[1].x)/2-pinch.ix*scale;y=(a[0].y+a[1].y)/2-pinch.iy*scale}else if(drag){x=drag.ox+p.x-drag.x;y=drag.oy+p.y-drag.y}constrain();draw();selectFocus('')}else if(lensOn&&ready){const ix=(p.x-x)/scale,iy=(p.y-y)/scale;if(ix>=0&&iy>=0&&ix<=m.width&&iy<=m.height){lens.hidden=false;lens.style.left=(p.x-90)+'px';lens.style.top=(p.y-90)+'px';const ls=scale*2.5;lens.style.backgroundImage=`url("${activeImage}")`;lens.style.backgroundSize=`${m.width*ls}px ${m.height*ls}px`;lens.style.backgroundPosition=`${90-ix*ls}px ${90-iy*ls}px`}else lens.hidden=true}});function end(e){points.delete(e.pointerId);pinch=null;drag=null;if(points.size===1){const p=[...points.values()][0];drag={...p,ox:x,oy:y}}if(!points.size)viewport.classList.remove('dragging')}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);viewport.addEventListener('pointerleave',()=>lens.hidden=true);viewport.addEventListener('keydown',e=>{if(['+','=','-','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','0'].includ

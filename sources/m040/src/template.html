<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c8969"><meta name="description" content="驾驶小飞机，在中国地图上探索行政区划、山脉、河流、高原、平原、盆地与湖泊。学习、自测、收集你的地理旅行印章。"><title>云游中国 · 小小飞行家</title><style>/*STYLE*/</style></head><body>
<header class="topbar"><a class="brand" href="#" aria-label="云游中国首页"><span class="brand-symbol" data-icon="compass"></span><span>云游中国<small>小小飞行家</small></span></a><nav class="main-nav" aria-label="主要功能"><button class="nav-item active" id="explore-nav" data-icon-before="map">探索地图</button><button class="nav-item" id="challenge-nav" data-icon-before="flag">飞行挑战</button><button class="nav-item" id="passport-nav" data-icon-before="book">我的护照<span id="passport-dot" class="nav-count">0</span></button></nav><div class="pilot-status"><span class="star-chip"><span data-icon="star"></span><b id="xp">0</b><span>星星</span></span><img class="pilot-avatar" src="assets/pilot.webp" alt="狐狸飞行伙伴"><span class="pilot-name">见习飞行员<small id="rank-label">每次发现，都是进步</small></span><button class="icon-button" id="help" aria-label="查看玩法" data-icon="help"></button></div></header>
<main id="workspace"><aside class="sidebar" id="sidebar"><div class="sidebar-top"><span class="eyebrow">FLY · DISCOVER · REMEMBER</span><h1>下一站，去哪里？</h1><p>把课本里的山河，变成你的旅行。</p><div class="search-wrap"><span data-icon="search"></span><input id="search" type="search" placeholder="寻找一个地方…" aria-label="搜索地理地点"><kbd>/</kbd></div></div><div id="category-tabs" class="category-tabs" role="group" aria-label="地理类型"></div><div class="list-heading"><span id="list-title">推荐探索</span><span id="list-count"></span></div><div id="destinations" class="destinations"></div><div class="route-card"><div class="route-heading"><span data-icon="flag"></span><b>第一条航线</b><span id="route-progress">0 / 3</span></div><p>青藏高原 → 长江 → 鄱阳湖</p><div class="route-track"><i></i><i></i><i></i></div><button id="route-next">开始我的第一站 <span data-icon="arrow"></span></button></div></aside>
<section class="world" id="world" aria-label="中国地理三维飞行地图"><canvas id="scene" tabindex="0" aria-label="拖动旋转地图，滚轮缩放；点击地点即可飞往；方向键驾驶飞机"></canvas><div id="map-labels"></div><div class="world-top"><div class="trip-tag"><span class="trip-icon" data-icon="globe"></span><span><b>中国 · 山河探索</b><small id="world-subtitle">70 个目的地，等你发现</small></span></div><div class="world-actions"><button id="labels-btn" class="map-button active" title="显示地名" aria-label="显示地名" aria-pressed="true" data-icon="tag"></button><button id="view-btn" class="map-button" title="俯瞰地图" aria-label="切换俯视地图" data-icon="layers"></button><button id="reset-view" class="map-button" title="回到全景" aria-label="回到全景" data-icon="expand"></button><button id="sound-btn" class="map-button" title="开启音效" aria-label="开启音效" aria-pressed="false" data-icon="volume"></button></div></div>
<div class="welcome-chip" id="welcome-chip"><span data-icon="spark"></span><span>点击地图上的地名，开启一场旅行</span><button id="welcome-close" aria-label="关闭提示">×</button></div><div class="sea-label east-sea">东 海</div><div class="sea-label south-sea">南 海</div><div id="arrival-ring" hidden></div>
<div class="flight-status" id="flight-status" aria-live="polite"><span data-icon="plane"></span><span id="flight-message">小飞机已准备好，随时出发！</span><button id="cancel-flight" hidden>暂停</button></div>
<div class="map-legend"><i class="green"></i>低地 <i class="sand"></i>高地 <i class="snow"></i>雪山 <small>地形夸张示意</small></div><div class="compass" aria-label="地图指北针"><b>N</b><span data-icon="navigation"></span></div>
<div class="zoom-controls"><button id="zoom-in" aria-label="放大地图">+</button><button id="zoom-out" aria-label="缩小地图">−</button></div>
<div class="cockpit"><button class="aircraft-button" id="hangar"><span data-icon="plane"></span><span><small>我的座驾</small><b id="plane-name">薄荷螺旋桨</b></span><span data-icon="chevron"></span></button><span class="cockpit-divider"></span><button class="flight-mode" id="manual-btn" aria-pressed="false"><span data-icon="gamepad"></span><span>自由驾驶</span></button><div class="control-hint" id="control-hint"><kbd>拖动</kbd>旋转 <kbd>滚轮</kbd>缩放</div><button class="map-button" id="fullscreen" title="全屏飞行" aria-label="全屏飞行" data-icon="expand"></button></div>
<div class="touch-pad" id="touch-pad" hidden><button data-dir="up" aria-label="向北飞">↑</button><button data-dir="left" aria-label="向西飞">←</button><button data-dir="down" aria-label="向南飞">↓</button><button data-dir="right" aria-label="向东飞">→</button></div>
<div class="loading" id="loading"><span class="spinner"></span><h2>正在展开中国地图</h2><p>小飞机马上就准备好了…</p></div><div id="scene-error" class="scene-error" hidden><h2>三维地图暂时没能起飞</h2><p>请使用支持图形加速的现代浏览器。你仍可以从左侧地点学习知识、完成自测。</p><button id="retry-scene">重新加载地图</button></div>
<article class="discovery-card" id="discovery-card" hidden aria-live="polite"></article></section></main>
<button id="mobile-list" class="mobile-list"><span data-icon="search"></span>找目的地</button><div class="toast" id="toast" role="status"></div><div id="confetti" aria-hidden="true"></div><dialog id="dialog"><div class="dialog-shell"><button class="dialog-close icon-button" id="close-dialog" aria-label="关闭窗口" data-icon="close"></button><div id="dialog-content"></div></div></dialog>
<script>/*THREE*/</script><script>/*DATA*/</script><script>/*ENGINE*/</script><script>/*APP*/</script></body></html>
